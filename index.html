<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>PSR-E473 Set Up</title>
  <style>
    :root {
      --bg: #070c18;
      --surface: #111a2e;
      --surface-2: #18243d;
      --surface-hover: #223254;
      --border: #253554;
      --primary: #2563eb;
      --primary-hover: #1d4ed8;
      --accent: #38bdf8;
      --purple: #a855f7;
      --green: #22c55e;
      --text: #f8fafc;
      --text-muted: #94a3b8;
      --danger: #ef4444;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }

    body {
      background-color: var(--bg);
      color: var(--text);
      min-height: 100vh;
      padding-bottom: 48px;
    }

    /* Header */
    header {
      background: linear-gradient(180deg, #0b1324 0%, #09101f 100%);
      border-bottom: 1px solid var(--border);
      padding: 16px 18px;
      position: sticky;
      top: 0;
      z-index: 20;
    }

    .header-inner {
      max-width: 760px;
      margin: 0 auto;
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 12px;
    }

    .header-left {
      display: flex;
      align-items: center;
      gap: 12px;
      min-width: 0;
    }

    .btn-back {
      background: var(--surface-2);
      color: var(--text);
      border: 1px solid var(--border);
      padding: 9px 13px;
      border-radius: 10px;
      font-weight: 700;
      font-size: 0.9rem;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 6px;
      flex-shrink: 0;
    }

    .btn-back:hover {
      background: var(--surface-hover);
      border-color: var(--accent);
    }

    .brand {
      display: flex;
      flex-direction: column;
      min-width: 0;
    }

    .brand-tag {
      font-size: 0.68rem;
      font-weight: 800;
      letter-spacing: 1.4px;
      color: var(--accent);
      text-transform: uppercase;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .brand h1 {
      font-size: 1.35rem;
      font-weight: 800;
      letter-spacing: 0.3px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .btn-add {
      background-color: var(--primary);
      color: #fff;
      border: none;
      padding: 10px 15px;
      border-radius: 10px;
      font-weight: 700;
      font-size: 0.92rem;
      cursor: pointer;
      flex-shrink: 0;
    }

    .btn-add:hover {
      background-color: var(--primary-hover);
    }

    .sync-status {
      max-width: 760px;
      margin: 8px auto 0;
      font-size: 0.72rem;
      color: var(--text-muted);
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .status-dot {
      display: inline-block;
      width: 7px;
      height: 7px;
      border-radius: 50%;
      margin-right: 5px;
      background: var(--green);
    }

    .status-dot.local {
      background: #f59e0b;
    }

    /* Views */
    .view {
      display: none;
      max-width: 760px;
      margin: 18px auto 0;
      padding: 0 18px;
    }

    .view.active {
      display: block;
    }

    /* Search & Auto-Suggest */
    .search-wrapper {
      position: relative;
      margin-bottom: 18px;
    }

    .search-input {
      width: 100%;
      padding: 14px 16px;
      background-color: var(--surface);
      border: 1px solid var(--border);
      border-radius: 12px;
      color: var(--text);
      font-size: 1rem;
      outline: none;
    }

    .search-input:focus {
      border-color: var(--accent);
    }

    .suggestions-box {
      position: absolute;
      top: calc(100% + 6px);
      left: 0;
      right: 0;
      background-color: var(--surface-2);
      border: 1px solid var(--border);
      border-radius: 12px;
      box-shadow: 0 14px 30px rgba(0, 0, 0, 0.65);
      z-index: 30;
      max-height: 240px;
      overflow-y: auto;
      display: none;
    }

    .suggestions-box.active {
      display: block;
    }

    .suggestion-item {
      padding: 12px 16px;
      cursor: pointer;
      border-bottom: 1px solid var(--border);
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 10px;
    }

    .suggestion-item:last-child {
      border-bottom: none;
    }

    .suggestion-item:hover {
      background-color: var(--surface-hover);
    }

    .suggestion-meta {
      font-size: 0.78rem;
      color: var(--text-muted);
      text-align: right;
    }

    /* Song Cards */
    .song-list {
      display: flex;
      flex-direction: column;
      gap: 16px;
    }

    .song-card {
      background-color: var(--surface);
      border: 1px solid var(--border);
      border-radius: 14px;
      padding: 18px;
    }

    .song-header {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      gap: 12px;
      margin-bottom: 14px;
    }

    .song-title {
      font-size: 1.3rem;
      font-weight: 800;
      line-height: 1.25;
      color: #fff;
    }

    .song-actions {
      display: flex;
      flex-wrap: wrap;
      gap: 7px;
      justify-content: flex-end;
      flex-shrink: 0;
    }

    .btn-action {
      background: var(--surface-2);
      color: var(--text);
      border: 1px solid var(--border);
      padding: 7px 11px;
      border-radius: 8px;
      font-size: 0.82rem;
      font-weight: 600;
      cursor: pointer;
    }

    .btn-action:hover {
      background: var(--surface-hover);
    }

    .btn-play {
      background: rgba(34, 197, 94, 0.15);
      color: #4ade80;
      border-color: rgba(34, 197, 94, 0.4);
    }

    .btn-play:hover {
      background: rgba(34, 197, 94, 0.25);
    }

    .btn-delete:hover {
      color: #fca5a5;
      border-color: var(--danger);
    }

    .psr-badges {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
      margin-bottom: 14px;
    }

    .badge {
      background-color: var(--bg);
      padding: 12px 14px;
      border-radius: 10px;
      border-left: 3px solid var(--accent);
    }

    .badge.style-badge {
      border-left-color: var(--purple);
    }

    .badge-label {
      font-size: 0.7rem;
      font-weight: 800;
      text-transform: uppercase;
      letter-spacing: 1px;
      color: var(--text-muted);
      display: block;
      margin-bottom: 4px;
    }

    .badge-val {
      font-size: 1.05rem;
      font-weight: 700;
      color: #fff;
    }

    .chord-preview {
      background-color: #060a14;
      border: 1px solid #1b2842;
      border-radius: 10px;
      padding: 14px;
      font-family: "Courier New", Courier, monospace;
      font-size: 0.98rem;
      line-height: 1.6;
      white-space: pre-wrap;
      color: #e2e8f0;
    }

    /* Editor View */
    .panel {
      background-color: var(--surface);
      border: 1px solid var(--border);
      border-radius: 14px;
      padding: 20px;
    }

    .panel h2 {
      font-size: 1.25rem;
      margin-bottom: 16px;
    }

    .form-group {
      margin-bottom: 14px;
    }

    .form-group label {
      display: block;
      font-size: 0.82rem;
      font-weight: 700;
      color: var(--text-muted);
      margin-bottom: 6px;
    }

    .form-control {
      width: 100%;
      padding: 11px 13px;
      background-color: var(--bg);
      border: 1px solid var(--border);
      border-radius: 9px;
      color: var(--text);
      font-size: 0.98rem;
      outline: none;
    }

    .form-control:focus {
      border-color: var(--accent);
    }

    .row-2 {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
    }

    .chords-box {
      background-color: var(--bg);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 12px;
    }

    .transpose-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding-bottom: 10px;
      margin-bottom: 10px;
      border-bottom: 1px solid var(--border);
    }

    .transpose-controls {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .btn-trans {
      background: var(--surface-2);
      color: #fff;
      border: 1px solid var(--border);
      width: 36px;
      height: 36px;
      border-radius: 8px;
      font-size: 1.15rem;
      font-weight: 700;
      cursor: pointer;
    }

    .btn-trans:hover {
      background: var(--primary);
      border-color: var(--primary);
    }

    .transpose-indicator {
      min-width: 46px;
      text-align: center;
      font-weight: 800;
      color: var(--accent);
      font-size: 0.95rem;
    }

    textarea.chord-editor {
      width: 100%;
      min-height: 170px;
      background: #060a14;
      color: var(--accent);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 12px;
      font-family: "Courier New", Courier, monospace;
      font-size: 1rem;
      line-height: 1.6;
      resize: vertical;
      outline: none;
    }

    .editor-footer {
      display: flex;
      justify-content: flex-end;
      gap: 10px;
      margin-top: 18px;
    }

    .btn-save {
      background: var(--primary);
      color: #fff;
      border: none;
      padding: 12px 22px;
      border-radius: 10px;
      font-size: 0.98rem;
      font-weight: 700;
      cursor: pointer;
    }

    .btn-save:hover {
      background: var(--primary-hover);
    }

    .btn-save:disabled {
      opacity: 0.6;
      cursor: not-allowed;
    }

    /* Full-Screen Play Mode */
    .play-container {
      max-width: 920px;
      margin: 0 auto;
    }

    .play-meta {
      display: flex;
      flex-wrap: wrap;
      justify-content: space-between;
      align-items: center;
      gap: 12px;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 14px;
      padding: 14px 18px;
      margin-bottom: 16px;
    }

    .play-patches {
      display: flex;
      flex-wrap: wrap;
      gap: 14px;
      font-size: 0.95rem;
    }

    .play-patches span strong {
      color: var(--accent);
    }

    .play-chords-screen {
      background: #050811;
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 26px 22px;
      min-height: 62vh;
      font-family: "Courier New", Courier, monospace;
      font-size: clamp(1.3rem, 3.2vw, 2.2rem);
      line-height: 1.75;
      white-space: pre-wrap;
      color: #f8fafc;
      letter-spacing: 0.5px;
    }

    .empty-state {
      text-align: center;
      padding: 44px 20px;
      background: var(--surface);
      border: 1px dashed var(--border);
      border-radius: 14px;
      color: var(--text-muted);
    }

    .toast {
      position: fixed;
      bottom: 20px;
      left: 50%;
      transform: translateX(-50%);
      background: var(--surface-2);
      color: #fff;
      border: 1px solid var(--accent);
      padding: 10px 18px;
      border-radius: 999px;
      font-size: 0.88rem;
      font-weight: 600;
      box-shadow: 0 10px 25px rgba(0, 0, 0, 0.5);
      z-index: 100;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.2s;
    }

    .toast.show {
      opacity: 1;
    }
  </style>
</head>
<body>

  <header>
    <div class="header-inner">
      <div class="header-left">
        <!-- Hidden on Home, always present on Editor & Play pages -->
        <button type="button" class="btn-back" id="backBtn" style="display: none;">← Back</button>
        <div class="brand">
          <span class="brand-tag" id="headerSub">YAMAHA KEYBOARD MANAGER</span>
          <h1 id="headerTitle">PSR-E473 Set Up</h1>
        </div>
      </div>
      <button type="button" class="btn-add" id="addSongBtn">+ Add Song</button>
    </div>
    <div class="sync-status">
      <span id="syncIndicator"><span class="status-dot local" id="statusDot"></span>Local Storage Mode (Add Firebase config to sync cloud)</span>
      <span id="songCount">0 songs</span>
    </div>
  </header>

  <!-- HOME PAGE -->
  <section id="homeView" class="view active">
    <div class="search-wrapper">
      <input
        type="text"
        id="searchInput"
        class="search-input"
        placeholder="Search saved songs, voices, styles, or chords..."
        autocomplete="off"
      />
      <div class="suggestions-box" id="suggestionsBox"></div>
    </div>

    <div class="song-list" id="songList"></div>
  </section>

  <!-- ADD / EDIT SONG PAGE -->
  <section id="editorView" class="view">
    <div class="panel">
      <h2 id="editorHeading">Add PSR-E473 Entry</h2>
      <form id="songForm">
        <input type="hidden" id="songId" />

        <div class="form-group">
          <label for="titleInput">Song Title</label>
          <input type="text" id="titleInput" class="form-control" placeholder="e.g., Mahal na Mahal kita Panginoon" required />
        </div>

        <div class="row-2">
          <div class="form-group">
            <label for="voiceInput">Voice</label>
            <input type="text" id="voiceInput" class="form-control" placeholder="e.g., 43" required />
          </div>
          <div class="form-group">
            <label for="styleInput">Style</label>
            <input type="text" id="styleInput" class="form-control" placeholder="e.g., 133" required />
          </div>
        </div>

        <div class="form-group">
          <label>Chords Table</label>
          <div class="chords-box">
            <div class="transpose-bar">
              <span style="font-size: 0.85rem; color: var(--text-muted); font-weight: 600;">Transpose</span>
              <div class="transpose-controls">
                <button type="button" class="btn-trans" id="editorTransDown" title="Transpose Down (-1)">-</button>
                <span class="transpose-indicator" id="editorTransVal">0</span>
                <button type="button" class="btn-trans" id="editorTransUp" title="Transpose Up (+1)">+</button>
              </div>
            </div>
            <textarea
              id="chordsInput"
              class="chord-editor"
              placeholder="intro&#10;G C D Em F F#m&#10;G C G C G C"
            ></textarea>
          </div>
        </div>

        <div class="editor-footer">
          <button type="submit" class="btn-save" id="saveSongBtn">Save</button>
        </div>
      </form>
    </div>
  </section>

  <!-- FULL-SCREEN PLAY CHORDS PAGE -->
  <section id="playView" class="view">
    <div class="play-container">
      <div class="play-meta">
        <div class="play-patches">
          <span>VOICE: <strong id="playVoice">-</strong></span>
          <span>STYLE: <strong id="playStyle">-</strong></span>
        </div>
        <div class="transpose-controls">
          <span style="font-size: 0.85rem; color: var(--text-muted); font-weight: 700;">Transpose</span>
          <button type="button" class="btn-trans" id="playTransDown" title="Transpose Down (-1)">-</button>
          <span class="transpose-indicator" id="playTransVal">0</span>
          <button type="button" class="btn-trans" id="playTransUp" title="Transpose Up (+1)">+</button>
        </div>
      </div>

      <div class="play-chords-screen" id="playChordsScreen"></div>
    </div>
  </section>

  <div class="toast" id="toast"></div>

  <!-- Firebase SDK (Modular ES Module) -->
  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
    import {
      getFirestore,
      collection,
      doc,
      setDoc,
      deleteDoc,
      onSnapshot
    } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

    // =========================================================================
    // 1. FIREBASE CONFIG (Paste your Firebase project keys here)
    // =========================================================================
    const firebaseConfig = {
      apiKey: "YOUR_API_KEY",
      authDomain: "YOUR_PROJECT_ID.firebaseapp.com",
      projectId: "YOUR_PROJECT_ID",
      storageBucket: "YOUR_PROJECT_ID.appspot.com",
      messagingSenderId: "YOUR_SENDER_ID",
      appId: "YOUR_APP_ID"
    };

    const hasFirebaseConfig =
      firebaseConfig.apiKey && !firebaseConfig.apiKey.startsWith("YOUR_");

    let db = null;
    let songsCol = null;

    const statusDot = document.getElementById("statusDot");
    const syncIndicator = document.getElementById("syncIndicator");

    if (hasFirebaseConfig) {
      const app = initializeApp(firebaseConfig);
      db = getFirestore(app);
      songsCol = collection(db, "psr_e473_songs");
      statusDot.classList.remove("local");
      syncIndicator.innerHTML = `<span class="status-dot"></span>Firebase Firestore Connected`;
    }

    // =========================================================================
    // 2. DATA STORE (Firebase + LocalStorage Fallback)
    // =========================================================================
    const LOCAL_KEY = "psr_e473_songs_v2";
    const defaultSongs = [
      {
        id: "sample-1",
        title: "Mahal na Mahal kita Panginoon",
        voice: "43",
        style: "133",
        chords: "intro\nG C D Em F F#m\nG C G C G C",
        updatedAt: Date.now()
      }
    ];

    let songs = loadLocalSongs();

    function loadLocalSongs() {
      try {
        const raw = localStorage.getItem(LOCAL_KEY);
        if (!raw) return [...defaultSongs];
        const parsed = JSON.parse(raw);
        return Array.isArray(parsed) ? parsed : [...defaultSongs];
      } catch {
        return [...defaultSongs];
      }
    }

    function saveLocalSongs(list) {
      localStorage.setItem(LOCAL_KEY, JSON.stringify(list));
    }

    if (hasFirebaseConfig && songsCol) {
      onSnapshot(songsCol, (snapshot) => {
        const cloudSongs = [];
        snapshot.forEach((docSnap) => {
          cloudSongs.push({ id: docSnap.id, ...docSnap.data() });
        });
        cloudSongs.sort((a, b) => (b.updatedAt || 0) - (a.updatedAt || 0));
        songs = cloudSongs;
        saveLocalSongs(songs);
        renderHome(searchInput.value);
      });
    }

    async function persistSongToFirebase(song) {
      saveLocalSongs(
        songs.some((s) => s.id === song.id)
          ? songs.map((s) => (s.id === song.id ? song : s))
          : [song, ...songs]
      );

      if (!hasFirebaseConfig || !songsCol) {
        songs = loadLocalSongs();
        return;
      }

      await setDoc(doc(db, "psr_e473_songs", song.id), {
        title: song.title,
        voice: song.voice,
        style: song.style,
        chords: song.chords,
        updatedAt: Date.now()
      });
    }

    async function removeSongFromFirebase(id) {
      const updated = songs.filter((s) => s.id !== id);
      saveLocalSongs(updated);
      songs = updated;

      if (hasFirebaseConfig && songsCol) {
        await deleteDoc(doc(db, "psr_e473_songs", id));
      }
    }

    // =========================================================================
    // 3. NAVIGATION & PHONE BACK BUTTON SYNC
    // =========================================================================
    // Stack of page states: { page: "home" | "editor" | "play", songId?: string }
    let navStack = [{ page: "home" }];
    let isHandlingPopstate = false;

    const backBtn = document.getElementById("backBtn");
    const addSongBtn = document.getElementById("addSongBtn");
    const homeView = document.getElementById("homeView");
    const editorView = document.getElementById("editorView");
    const playView = document.getElementById("playView");
    const headerTitle = document.getElementById("headerTitle");
    const headerSub = document.getElementById("headerSub");

    // Initialize base history entry
    history.replaceState({ stackIndex: 0 }, "", "#home");

    function navigateTo(nextState) {
      const currentTop = navStack[navStack.length - 1];
      if (
        currentTop &&
        currentTop.page === nextState.page &&
        currentTop.songId === nextState.songId
      ) {
        applyRoute(nextState);
        return;
      }

      navStack.push(nextState);
      const stackIndex = navStack.length - 1;
      history.pushState({ stackIndex }, "", `#${nextState.page}`);
      applyRoute(nextState);
    }

    function goBackOneStep() {
      if (navStack.length > 1) {
        // Trigger browser back so phone/browser history stays in sync
        history.back();
      } else {
        applyRoute({ page: "home" });
      }
    }

    window.addEventListener("popstate", (event) => {
      isHandlingPopstate = true;
      if (event.state && typeof event.state.stackIndex === "number") {
        const targetIdx = Math.max(0, Math.min(event.state.stackIndex, navStack.length - 1));
        navStack = navStack.slice(0, targetIdx + 1);
      } else if (navStack.length > 1) {
        navStack.pop();
      } else {
        navStack = [{ page: "home" }];
      }
      applyRoute(navStack[navStack.length - 1]);
      isHandlingPopstate = false;
    });

    function applyRoute(state) {
      homeView.classList.remove("active");
      editorView.classList.remove("active");
      playView.classList.remove("active");

      if (state.page === "home") {
        homeView.classList.add("active");
        backBtn.style.display = "none";
        addSongBtn.style.display = "inline-flex";
        headerSub.textContent = "YAMAHA KEYBOARD MANAGER";
        headerTitle.textContent = "PSR-E473 Set Up";
        renderHome(searchInput.value);
      } else if (state.page === "editor") {
        editorView.classList.add("active");
        backBtn.style.display = "inline-flex";
        addSongBtn.style.display = "none";
        headerSub.textContent = "PSR-E473 SET UP";
        headerTitle.textContent = state.songId ? "Edit Song" : "Add Song";
        loadEditor(state.songId || null);
      } else if (state.page === "play") {
        playView.classList.add("active");
        backBtn.style.display = "inline-flex";
        addSongBtn.style.display = "none";
        loadPlayScreen(state.songId);
      }
    }

    backBtn.addEventListener("click", goBackOneStep);
    addSongBtn.addEventListener("click", () => navigateTo({ page: "editor", songId: null }));

    // =========================================================================
    // 4. CHORD TRANSPOSITION ENGINE
    // =========================================================================
    const NOTES_SHARP = ["C", "C#", "D", "D#", "E", "F", "F#", "G", "G#", "A", "A#", "B"];
    const NOTES_FLAT  = ["C", "Db", "D", "Eb", "E", "F", "Gb", "G", "Ab", "A", "Bb", "B"];

    function shiftNote(note, semitones) {
      let idx = NOTES_SHARP.indexOf(note);
      let useFlats = false;
      if (idx === -1) {
        idx = NOTES_FLAT.indexOf(note);
        useFlats = true;
      }
      if (idx === -1) return note;
      const newIdx = (idx + semitones + 120) % 12;
      return useFlats ? NOTES_FLAT[newIdx] : NOTES_SHARP[newIdx];
    }

    function transposeChords(text, semitones) {
      if (!text || !semitones) return text;
      return text.replace(
        /(?<![A-Za-z0-9#b])([A-G](?:#|b)?)((?:maj|min|m|dim|aug|sus|add)?[0-9]*(?:b5|#5|b9|#9|#11|b13)?(?:\/[A-G](?:#|b)?)?)(?=\s|\||$|\/)/g,
        (match, root, suffix) => {
          const nextRoot = shiftNote(root, semitones);
          let nextSuffix = suffix;
          if (suffix.includes("/")) {
            const [qual, bass] = suffix.split("/");
            nextSuffix = `${qual}/${shiftNote(bass, semitones)}`;
          }
          return `${nextRoot}${nextSuffix}`;
        }
      );
    }

    // =========================================================================
    // 5. HOME: SEARCH + AUTO-SUGGEST + SONG LIST
    // =========================================================================
    const songListEl = document.getElementById("songList");
    const searchInput = document.getElementById("searchInput");
    const suggestionsBox = document.getElementById("suggestionsBox");
    const songCountEl = document.getElementById("songCount");

    function renderHome(filterText = "") {
      songCountEl.textContent = `${songs.length} ${songs.length === 1 ? "song" : "songs"}`;
      const q = filterText.trim().toLowerCase();

      const filtered = songs.filter(
        (s) =>
          (s.title || "").toLowerCase().includes(q) ||
          String(s.voice || "").toLowerCase().includes(q) ||
          String(s.style || "").toLowerCase().includes(q) ||
          (s.chords || "").toLowerCase().includes(q)
      );

      if (filtered.length === 0) {
        songListEl.innerHTML = `
          <div class="empty-state">
            <p>No songs found.</p>
            <p style="font-size:0.85rem;margin-top:6px;">Tap <strong>+ Add Song</strong> to create a PSR-E473 setup.</p>
          </div>
        `;
        return;
      }

      songListEl.innerHTML = filtered
        .map(
          (song) => `
          <div class="song-card">
            <div class="song-header">
              <div class="song-title">${escapeHtml(song.title)}</div>
              <div class="song-actions">
                <button type="button" class="btn-action btn-play" data-play="${song.id}">▶ Play</button>
                <button type="button" class="btn-action" data-edit="${song.id}">Edit</button>
                <button type="button" class="btn-action btn-delete" data-delete="${song.id}">Delete</button>
              </div>
            </div>
            <div class="psr-badges">
              <div class="badge">
                <span class="badge-label">Voice</span>
                <span class="badge-val">${escapeHtml(String(song.voice))}</span>
              </div>
              <div class="badge style-badge">
                <span class="badge-label">Style</span>
                <span class="badge-val">${escapeHtml(String(song.style))}</span>
              </div>
            </div>
            ${song.chords ? `<div class="chord-preview">${escapeHtml(song.chords)}</div>` : ""}
          </div>
        `
        )
        .join("");
    }

    songListEl.addEventListener("click", async (e) => {
      const playId = e.target.closest("[data-play]")?.dataset.play;
      const editId = e.target.closest("[data-edit]")?.dataset.edit;
      const deleteId = e.target.closest("[data-delete]")?.dataset.delete;

      if (playId) {
        navigateTo({ page: "play", songId: playId });
      } else if (editId) {
        navigateTo({ page: "editor", songId: editId });
      } else if (deleteId) {
        if (confirm("Delete this song setup?")) {
          await removeSongFromFirebase(deleteId);
          renderHome(searchInput.value);
          showToast("Deleted");
        }
      }
    });

    searchInput.addEventListener("input", () => {
      const val = searchInput.value;
      renderHome(val);
      updateSuggestions(val);
    });

    function updateSuggestions(query) {
      const clean = query.trim().toLowerCase();
      if (!clean) {
        suggestionsBox.classList.remove("active");
        return;
      }

      // Collect matching song titles and matching words
      const wordSet = new Set();
      songs.forEach((s) => {
        [s.title, String(s.voice), String(s.style)].forEach((field) => {
          (field || "").split(/\s+/).forEach((word) => {
            const w = word.trim();
            if (w && w.toLowerCase().includes(clean)) {
              wordSet.add(w);
            }
          });
        });
      });

      const titleMatches = songs.filter(
        (s) =>
          (s.title || "").toLowerCase().includes(clean) ||
          String(s.voice || "").toLowerCase().includes(clean) ||
          String(s.style || "").toLowerCase().includes(clean)
      );

      if (titleMatches.length === 0 && wordSet.size === 0) {
        suggestionsBox.classList.remove("active");
        return;
      }

      const wordChips = Array.from(wordSet)
        .slice(0, 6)
        .map(
          (w) => `
          <div class="suggestion-item" data-suggest="${escapeHtml(w)}">
            <span>Word: <strong>${escapeHtml(w)}</strong></span>
            <span class="suggestion-meta">Auto-suggest</span>
          </div>
        `
        )
        .join("");

      const songItems = titleMatches
        .slice(0, 6)
        .map(
          (s) => `
          <div class="suggestion-item" data-suggest="${escapeHtml(s.title)}">
            <strong>${escapeHtml(s.title)}</strong>
            <span class="suggestion-meta">Voice ${escapeHtml(String(s.voice))} • Style ${escapeHtml(String(s.style))}</span>
          </div>
        `
        )
        .join("");

      suggestionsBox.innerHTML = wordChips + songItems;
      suggestionsBox.classList.add("active");
    }

    suggestionsBox.addEventListener("click", (e) => {
      const item = e.target.closest("[data-suggest]");
      if (!item) return;
      const picked = item.dataset.suggest;
      searchInput.value = picked;
      suggestionsBox.classList.remove("active");
      renderHome(picked);
    });

    document.addEventListener("click", (e) => {
      if (!e.target.closest(".search-wrapper")) {
        suggestionsBox.classList.remove("active");
      }
    });

    // =========================================================================
    // 6. EDITOR: EDIT & SAVE FULL ENTRY TO FIREBASE
    // =========================================================================
    const songForm = document.getElementById("songForm");
    const editorHeading = document.getElementById("editorHeading");
    const songIdInput = document.getElementById("songId");
    const titleInput = document.getElementById("titleInput");
    const voiceInput = document.getElementById("voiceInput");
    const styleInput = document.getElementById("styleInput");
    const chordsInput = document.getElementById("chordsInput");
    const saveSongBtn = document.getElementById("saveSongBtn");
    const editorTransVal = document.getElementById("editorTransVal");

    let editorSemitones = 0;

    function loadEditor(songId) {
      editorSemitones = 0;
      editorTransVal.textContent = "0";

      if (songId) {
        const song = songs.find((s) => s.id === songId);
        if (song) {
          editorHeading.textContent = "Edit PSR-E473 Setup";
          songIdInput.value = song.id;
          titleInput.value = song.title || "";
          voiceInput.value = song.voice || "";
          styleInput.value = song.style || "";
          chordsInput.value = song.chords || "";
          return;
        }
      }

      editorHeading.textContent = "Add PSR-E473 Setup";
      songIdInput.value = "";
      titleInput.value = "";
      voiceInput.value = "";
      styleInput.value = "";
      chordsInput.value = "";
    }

    document.getElementById("editorTransUp").addEventListener("click", () => {
      editorSemitones += 1;
      editorTransVal.textContent = editorSemitones > 0 ? `+${editorSemitones}` : `${editorSemitones}`;
      chordsInput.value = transposeChords(chordsInput.value, 1);
    });

    document.getElementById("editorTransDown").addEventListener("click", () => {
      editorSemitones -= 1;
      editorTransVal.textContent = editorSemitones > 0 ? `+${editorSemitones}` : `${editorSemitones}`;
      chordsInput.value = transposeChords(chordsInput.value, -1);
    });

    songForm.addEventListener("submit", async (e) => {
      e.preventDefault();
      saveSongBtn.disabled = true;

      const entry = {
        id: songIdInput.value || `song-${Date.now()}`,
        title: titleInput.value.trim(),
        voice: voiceInput.value.trim(),
        style: styleInput.value.trim(),
        chords: chordsInput.value,
        updatedAt: Date.now()
      };

      try {
        await persistSongToFirebase(entry);
        showToast(hasFirebaseConfig ? "Saved to Firebase" : "Saved locally");
        goBackOneStep();
      } catch (err) {
        console.error(err);
        showToast("Error saving to Firebase");
      } finally {
        saveSongBtn.disabled = false;
      }
    });

    // =========================================================================
    // 7. FULL-SCREEN PLAY VIEW WITH LIVE TRANSPOSE
    // =========================================================================
    const playVoiceEl = document.getElementById("playVoice");
    const playStyleEl = document.getElementById("playStyle");
    const playChordsScreen = document.getElementById("playChordsScreen");
    const playTransVal = document.getElementById("playTransVal");

    let activePlaySong = null;
    let playSemitones = 0;

    function loadPlayScreen(songId) {
      const song = songs.find((s) => s.id === songId);
      if (!song) {
        goBackOneStep();
        return;
      }
      activePlaySong = song;
      playSemitones = 0;
      headerSub.textContent = "FULL-SCREEN CHORDS";
      headerTitle.textContent = song.title;
      playVoiceEl.textContent = song.voice;
      playStyleEl.textContent = song.style;
      renderPlayChords();
    }

    function renderPlayChords() {
      if (!activePlaySong) return;
      playTransVal.textContent = playSemitones > 0 ? `+${playSemitones}` : `${playSemitones}`;
      playChordsScreen.textContent = transposeChords(activePlaySong.chords || "", playSemitones);
    }

    document.getElementById("playTransUp").addEventListener("click", () => {
      playSemitones += 1;
      renderPlayChords();
    });

    document.getElementById("playTransDown").addEventListener("click", () => {
      playSemitones -= 1;
      renderPlayChords();
    });

    // =========================================================================
    // 8. HELPERS
    // =========================================================================
    function escapeHtml(str) {
      return String(str).replace(/[&<>"']/g, (m) => ({
        "&": "&amp;",
        "<": "&lt;",
        ">": "&gt;",
        '"': "&quot;",
        "'": "&#39;"
      }[m]));
    }

    let toastTimer;
    function showToast(msg) {
      const toast = document.getElementById("toast");
      toast.textContent = msg;
      toast.classList.add("show");
      clearTimeout(toastTimer);
      toastTimer = setTimeout(() => toast.classList.remove("show"), 2000);
    }

    // Initial Home Render
    renderHome();
  </script>
</body>
</html>
