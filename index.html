<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>PSR E473 bypaulm</title>
  <style>
    :root {
      --bg: #070c18;
      --surface: #111a2e;
      --surface-2: #18243d;
      --surface-hover: #223254;
      --border: #253554;
      --primary: #2563eb;
      --primary-hover: #1d4ed8;
      --accent: #38bdf8;
      --purple: #a855f7;
      --amber: #f59e0b;
      --chord-green: #4ade80;
      --text: #f8fafc;
      --text-muted: #94a3b8;
      --danger: #ef4444;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }

    body {
      background-color: var(--bg);
      color: var(--text);
      min-height: 100dvh;
      display: flex;
      flex-direction: column;
    }

    /* Header */
    header {
      background: linear-gradient(180deg, #0b1324 0%, #09101f 100%);
      border-bottom: 1px solid var(--border);
      padding: 10px 14px;
      position: sticky;
      top: 0;
      z-index: 20;
      flex-shrink: 0;
    }

    .header-inner {
      max-width: 720px;
      margin: 0 auto;
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 10px;
    }

    .header-left {
      display: flex;
      align-items: center;
      gap: 8px;
      min-width: 0;
    }

    .btn-back {
      background: var(--surface-2);
      color: var(--text);
      border: 1px solid var(--border);
      padding: 6px 10px;
      border-radius: 8px;
      font-weight: 700;
      font-size: 0.8rem;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 4px;
      flex-shrink: 0;
    }

    .btn-back:hover {
      background: var(--surface-hover);
      border-color: var(--accent);
    }

    .brand {
      display: flex;
      flex-direction: column;
      min-width: 0;
    }

    .brand-tag {
      font-size: 0.6rem;
      font-weight: 800;
      letter-spacing: 1.1px;
      color: var(--accent);
      text-transform: uppercase;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .brand h1 {
      font-size: 1.1rem;
      font-weight: 800;
      letter-spacing: 0.2px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .btn-add {
      background-color: var(--primary);
      color: #fff;
      border: none;
      padding: 7px 12px;
      border-radius: 8px;
      font-weight: 700;
      font-size: 0.82rem;
      cursor: pointer;
      flex-shrink: 0;
    }

    .btn-add:hover {
      background-color: var(--primary-hover);
    }

    .sync-status {
      max-width: 720px;
      margin: 4px auto 0;
      font-size: 0.66rem;
      color: var(--text-muted);
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .status-dot {
      display: inline-block;
      width: 6px;
      height: 6px;
      border-radius: 50%;
      margin-right: 5px;
      background: var(--chord-green);
    }

    .status-dot.local {
      background: var(--amber);
    }

    /* Views */
    .view {
      display: none;
      width: 100%;
      max-width: 720px;
      margin: 0 auto;
      padding: 12px 14px 16px;
      flex: 1;
    }

    .view.active {
      display: flex;
      flex-direction: column;
    }

    /* Search & Auto-Suggest */
    .search-wrapper {
      position: relative;
      margin-bottom: 12px;
    }

    .search-input {
      width: 100%;
      padding: 10px 13px;
      background-color: var(--surface);
      border: 1px solid var(--border);
      border-radius: 10px;
      color: var(--text);
      font-size: 0.9rem;
      outline: none;
    }

    .search-input:focus {
      border-color: var(--accent);
    }

    .suggestions-box {
      position: absolute;
      top: calc(100% + 5px);
      left: 0;
      right: 0;
      background-color: var(--surface-2);
      border: 1px solid var(--border);
      border-radius: 10px;
      box-shadow: 0 12px 24px rgba(0, 0, 0, 0.65);
      z-index: 30;
      max-height: 220px;
      overflow-y: auto;
      display: none;
    }

    .suggestions-box.active {
      display: block;
    }

    .suggestion-item {
      padding: 9px 13px;
      cursor: pointer;
      border-bottom: 1px solid var(--border);
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 8px;
      font-size: 0.86rem;
    }

    .suggestion-item:last-child {
      border-bottom: none;
    }

    .suggestion-item:hover {
      background-color: var(--surface-hover);
    }

    .suggestion-meta {
      font-size: 0.72rem;
      color: var(--text-muted);
      text-align: right;
    }

    /* Song Cards (Home) */
    .song-list {
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .song-card {
      background-color: var(--surface);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 13px;
    }

    .song-header {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      gap: 10px;
      margin-bottom: 9px;
    }

    .song-title {
      font-size: 1.05rem;
      font-weight: 800;
      line-height: 1.25;
      color: #fff;
    }

    .song-actions {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
      justify-content: flex-end;
      flex-shrink: 0;
    }

    .btn-action {
      background: var(--surface-2);
      color: var(--text);
      border: 1px solid var(--border);
      padding: 5px 9px;
      border-radius: 7px;
      font-size: 0.75rem;
      font-weight: 600;
      cursor: pointer;
    }

    .btn-action:hover {
      background: var(--surface-hover);
    }

    .btn-play {
      background: rgba(74, 222, 128, 0.14);
      color: var(--chord-green);
      border-color: rgba(74, 222, 128, 0.4);
    }

    .btn-play:hover {
      background: rgba(74, 222, 128, 0.24);
    }

    .btn-delete:hover {
      color: #fca5a5;
      border-color: var(--danger);
    }

    /* Compact Voice, Style & Tempo Badges */
    .psr-badges {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 6px;
      margin-bottom: 9px;
    }

    .badge {
      background-color: var(--bg);
      padding: 5px 8px;
      border-radius: 7px;
      border-left: 2px solid var(--accent);
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 4px;
      min-width: 0;
    }

    .badge.style-badge {
      border-left-color: var(--purple);
    }

    .badge.tempo-badge {
      border-left-color: var(--amber);
    }

    .badge-label {
      font-size: 0.6rem;
      font-weight: 800;
      text-transform: uppercase;
      letter-spacing: 0.6px;
      color: var(--text-muted);
      flex-shrink: 0;
    }

    .badge-val {
      font-size: 0.82rem;
      font-weight: 700;
      color: #fff;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    /* Top Table (Editor & Play) */
    .top-table {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 7px 8px;
      margin-bottom: 8px;
      display: flex;
      flex-direction: column;
      gap: 6px;
      flex-shrink: 0;
    }

    .title-inline-input {
      width: 100%;
      background: var(--bg);
      border: 1px solid var(--border);
      border-radius: 7px;
      padding: 6px 9px;
      color: #fff;
      font-size: 0.92rem;
      font-weight: 700;
      outline: none;
    }

    .title-inline-input:focus {
      border-color: var(--accent);
    }

    .editor-meta-row {
      display: grid;
      grid-template-columns: 1fr 1fr 0.85fr auto;
      gap: 5px;
      align-items: center;
    }

    .play-top-only-transpose {
      display: flex;
      justify-content: flex-end;
      align-items: center;
    }

    .mini-field {
      background: var(--bg);
      border: 1px solid var(--border);
      border-radius: 7px;
      padding: 4px 7px;
      display: flex;
      align-items: center;
      gap: 4px;
      min-width: 0;
    }

    .mini-field.voice-field {
      border-left: 2px solid var(--accent);
    }

    .mini-field.style-field {
      border-left: 2px solid var(--purple);
    }

    .mini-field.tempo-field {
      border-left: 2px solid var(--amber);
    }

    .mini-label {
      font-size: 0.58rem;
      font-weight: 800;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      color: var(--text-muted);
      flex-shrink: 0;
    }

    .mini-input {
      width: 100%;
      min-width: 0;
      background: transparent;
      border: none;
      color: #fff;
      font-size: 0.8rem;
      font-weight: 700;
      outline: none;
    }

    .transpose-compact {
      background: var(--bg);
      border: 1px solid var(--border);
      border-radius: 7px;
      padding: 3px 6px;
      display: flex;
      align-items: center;
      gap: 5px;
      flex-shrink: 0;
    }

    .btn-trans {
      background: var(--surface-2);
      color: #fff;
      border: 1px solid var(--border);
      width: 24px;
      height: 24px;
      border-radius: 5px;
      font-size: 0.9rem;
      font-weight: 700;
      line-height: 1;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      justify-content: center;
    }

    .btn-trans:hover {
      background: var(--primary);
      border-color: var(--primary);
    }

    .transpose-indicator {
      min-width: 26px;
      text-align: center;
      font-weight: 800;
      color: var(--chord-green);
      font-size: 0.78rem;
    }

    /* 2nd Table: Maximized Green Chord Sheet */
    .chord-sheet {
      width: 100%;
      background-color: #060a14;
      border: 1px solid #1b2842;
      border-radius: 10px;
      padding: 11px 12px;
      font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, "Liberation Mono", "Courier New", monospace;
      font-size: 0.9rem;
      line-height: 1.5;
      letter-spacing: 0.2px;
      color: var(--chord-green);
      white-space: pre-wrap;
      word-wrap: break-word;
    }

    .chord-sheet.maximized {
      flex: 1;
      height: 100%;
      min-height: 0;
    }

    textarea.chord-sheet {
      resize: none;
      outline: none;
      display: block;
    }

    textarea.chord-sheet:focus {
      border-color: var(--chord-green);
    }

    #songForm {
      display: flex;
      flex-direction: column;
      flex: 1;
    }

    .editor-footer {
      display: flex;
      justify-content: flex-end;
      margin-top: 8px;
      flex-shrink: 0;
    }

    .btn-save {
      background: var(--primary);
      color: #fff;
      border: none;
      padding: 8px 18px;
      border-radius: 8px;
      font-size: 0.88rem;
      font-weight: 700;
      cursor: pointer;
    }

    .btn-save:hover {
      background: var(--primary-hover);
    }

    .btn-save:disabled {
      opacity: 0.6;
      cursor: not-allowed;
    }

    .empty-state {
      text-align: center;
      padding: 36px 18px;
      background: var(--surface);
      border: 1px dashed var(--border);
      border-radius: 12px;
      color: var(--text-muted);
      font-size: 0.9rem;
    }

    .toast {
      position: fixed;
      bottom: 16px;
      left: 50%;
      transform: translateX(-50%);
      background: var(--surface-2);
      color: #fff;
      border: 1px solid var(--chord-green);
      padding: 8px 16px;
      border-radius: 999px;
      font-size: 0.82rem;
      font-weight: 600;
      box-shadow: 0 10px 25px rgba(0, 0, 0, 0.5);
      z-index: 100;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.2s;
    }

    .toast.show {
      opacity: 1;
    }
  </style>
</head>
<body>

  <header>
    <div class="header-inner">
      <div class="header-left">
        <button type="button" class="btn-back" id="backBtn" style="display: none;">← Back</button>
        <div class="brand">
          <span class="brand-tag" id="headerSub">YAMAHA KEYBOARD MANAGER</span>
          <h1 id="headerTitle">PSR E473 bypaulm</h1>
        </div>
      </div>
      <button type="button" class="btn-add" id="addSongBtn">+ Add Song</button>
    </div>
    <div class="sync-status">
      <span id="syncIndicator"><span class="status-dot local" id="statusDot"></span>Firebase Ready (Local Fallback)</span>
      <span id="songCount">0 songs</span>
    </div>
  </header>

  <!-- HOME PAGE -->
  <section id="homeView" class="view active">
    <div class="search-wrapper">
      <input
        type="text"
        id="searchInput"
        class="search-input"
        placeholder="Search saved songs, voices, styles, tempo, or chords..."
        autocomplete="off"
      />
      <div class="suggestions-box" id="suggestionsBox"></div>
    </div>

    <div class="song-list" id="songList"></div>
  </section>

  <!-- ADD / EDIT SONG PAGE -->
  <section id="editorView" class="view">
    <form id="songForm">
      <input type="hidden" id="songId" />

      <!-- 1st Table: Title, Voice, Style, Tempo, Transpose -->
      <div class="top-table">
        <input
          type="text"
          id="titleInput"
          class="title-inline-input"
          placeholder="Song Title (e.g., Mahal na Mahal kita Panginoon)"
          required
        />
        <div class="editor-meta-row">
          <div class="mini-field voice-field">
            <span class="mini-label">Voice</span>
            <input type="text" id="voiceInput" class="mini-input" placeholder="43" required />
          </div>
          <div class="mini-field style-field">
            <span class="mini-label">Style</span>
            <input type="text" id="styleInput" class="mini-input" placeholder="133" required />
          </div>
          <div class="mini-field tempo-field">
            <span class="mini-label">Tempo</span>
            <input type="text" id="tempoInput" class="mini-input" placeholder="120" />
          </div>
          <div class="transpose-compact" title="Transpose">
            <button type="button" class="btn-trans" id="editorTransDown">-</button>
            <span class="transpose-indicator" id="editorTransVal">0</span>
            <button type="button" class="btn-trans" id="editorTransUp">+</button>
          </div>
        </div>
      </div>

      <!-- 2nd Table: Maximized Green Chords Sheet -->
      <textarea
        id="chordsInput"
        class="chord-sheet maximized"
        placeholder="intro&#10;G C D Em F F#m&#10;G C G C G C"
      ></textarea>

      <div class="editor-footer">
        <button type="submit" class="btn-save" id="saveSongBtn">Save</button>
      </div>
    </form>
  </section>

  <!-- PLAY MODE PAGE -->
  <section id="playView" class="view">
    <!-- 1st Table: Only Transpose + and - on Play Mode -->
    <div class="top-table play-top-only-transpose">
      <div class="transpose-compact" title="Transpose">
        <span class="mini-label">Transpose</span>
        <button type="button" class="btn-trans" id="playTransDown">-</button>
        <span class="transpose-indicator" id="playTransVal">0</span>
        <button type="button" class="btn-trans" id="playTransUp">+</button>
      </div>
    </div>

    <!-- 2nd Table: Maximized Green Chords Sheet -->
    <div class="chord-sheet maximized" id="playChordsScreen"></div>
  </section>

  <div class="toast" id="toast"></div>

  <!-- Firebase SDK (Modular ES Module) -->
  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
    import {
      getFirestore,
      collection,
      doc,
      setDoc,
      deleteDoc,
      onSnapshot,
      enableIndexedDbPersistence
    } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

    // =========================================================================
    // 1. FIREBASE CONFIG (Paste your Firebase Web App config keys)
    // =========================================================================
    const firebaseConfig = {
      apiKey: "YOUR_API_KEY",
      authDomain: "YOUR_PROJECT_ID.firebaseapp.com",
      projectId: "YOUR_PROJECT_ID",
      storageBucket: "YOUR_PROJECT_ID.appspot.com",
      messagingSenderId: "YOUR_SENDER_ID",
      appId: "YOUR_APP_ID"
    };

    const hasFirebaseConfig =
      firebaseConfig.apiKey && !firebaseConfig.apiKey.startsWith("YOUR_");

    let db = null;
    let songsCol = null;

    const statusDot = document.getElementById("statusDot");
    const syncIndicator = document.getElementById("syncIndicator");

    if (hasFirebaseConfig) {
      const app = initializeApp(firebaseConfig);
      db = getFirestore(app);
      enableIndexedDbPersistence(db).catch(() => {});
      songsCol = collection(db, "psr_e473_songs");
      statusDot.classList.remove("local");
      syncIndicator.innerHTML = `<span class="status-dot"></span>Firebase Firestore Live`;
    }

    // =========================================================================
    // 2. DATA STORE (Firebase + LocalStorage Fallback)
    // =========================================================================
    const LOCAL_KEY = "psr_e473_bypaulm_songs_v1";
    const defaultSongs = [
      {
        id: "sample-1",
        title: "Mahal na Mahal kita Panginoon",
        voice: "43",
        style: "133",
        tempo: "72",
        chords: "intro\nG C D Em F F#m\nG C G C G C",
        updatedAt: Date.now()
      }
    ];

    let songs = loadLocalSongs();

    function loadLocalSongs() {
      try {
        const raw = localStorage.getItem(LOCAL_KEY);
        if (!raw) return [...defaultSongs];
        const parsed = JSON.parse(raw);
        return Array.isArray(parsed) ? parsed : [...defaultSongs];
      } catch {
        return [...defaultSongs];
      }
    }

    function saveLocalSongs(list) {
      localStorage.setItem(LOCAL_KEY, JSON.stringify(list));
    }

    if (hasFirebaseConfig && songsCol) {
      onSnapshot(songsCol, (snapshot) => {
        const cloudSongs = [];
        snapshot.forEach((docSnap) => {
          cloudSongs.push({ id: docSnap.id, ...docSnap.data() });
        });
        cloudSongs.sort((a, b) => (b.updatedAt || 0) - (a.updatedAt || 0));
        songs = cloudSongs;
        saveLocalSongs(songs);
        renderHome(searchInput.value);
      });
    }

    async function persistSongToFirebase(song) {
      const nextList = songs.some((s) => s.id === song.id)
        ? songs.map((s) => (s.id === song.id ? song : s))
        : [song, ...songs];
      songs = nextList;
      saveLocalSongs(nextList);

      if (!hasFirebaseConfig || !songsCol) {
        return;
      }

      await setDoc(doc(db, "psr_e473_songs", song.id), {
        title: song.title,
        voice: song.voice,
        style: song.style,
        tempo: song.tempo,
        chords: song.chords,
        updatedAt: Date.now()
      });
    }

    async function removeSongFromFirebase(id) {
      const updated = songs.filter((s) => s.id !== id);
      songs = updated;
      saveLocalSongs(updated);

      if (hasFirebaseConfig && songsCol) {
        await deleteDoc(doc(db, "psr_e473_songs", id));
      }
    }

    // =========================================================================
    // 3. NAVIGATION & PHONE BACK BUTTON SYNC
    // =========================================================================
    let navStack = [{ page: "home" }];

    const backBtn = document.getElementById("backBtn");
    const addSongBtn = document.getElementById("addSongBtn");
    const homeView = document.getElementById("homeView");
    const editorView = document.getElementById("editorView");
    const playView = document.getElementById("playView");
    const headerTitle = document.getElementById("headerTitle");
    const headerSub = document.getElementById("headerSub");

    history.replaceState({ stackIndex: 0 }, "", "#home");

    function navigateTo(nextState) {
      const currentTop = navStack[navStack.length - 1];
      if (
        currentTop &&
        currentTop.page === nextState.page &&
        currentTop.songId === nextState.songId
      ) {
        applyRoute(nextState);
        return;
      }

      navStack.push(nextState);
      const stackIndex = navStack.length - 1;
      history.pushState({ stackIndex }, "", `#${nextState.page}`);
      applyRoute(nextState);
    }

    function goBackOneStep() {
      if (navStack.length > 1) {
        history.back();
      } else {
        applyRoute({ page: "home" });
      }
    }

    window.addEventListener("popstate", (event) => {
      if (event.state && typeof event.state.stackIndex === "number") {
        const targetIdx = Math.max(0, Math.min(event.state.stackIndex, navStack.length - 1));
        navStack = navStack.slice(0, targetIdx + 1);
      } else if (navStack.length > 1) {
        navStack.pop();
      } else {
        navStack = [{ page: "home" }];
      }
      applyRoute(navStack[navStack.length - 1]);
    });

    function applyRoute(state) {
      homeView.classList.remove("active");
      editorView.classList.remove("active");
      playView.classList.remove("active");

      if (state.page === "home") {
        homeView.classList.add("active");
        backBtn.style.display = "none";
        addSongBtn.style.display = "inline-flex";
        headerSub.textContent = "YAMAHA KEYBOARD MANAGER";
        headerTitle.textContent = "PSR E473 bypaulm";
        renderHome(searchInput.value);
      } else if (state.page === "editor") {
        editorView.classList.add("active");
        backBtn.style.display = "inline-flex";
        addSongBtn.style.display = "none";
        headerSub.textContent = "PSR E473 bypaulm";
        headerTitle.textContent = state.songId ? "Edit Song" : "Add Song";
        loadEditor(state.songId || null);
      } else if (state.page === "play") {
        playView.classList.add("active");
        backBtn.style.display = "inline-flex";
        addSongBtn.style.display = "none";
        loadPlayScreen(state.songId);
      }
    }

    backBtn.addEventListener("click", goBackOneStep);
    addSongBtn.addEventListener("click", () => navigateTo({ page: "editor", songId: null }));

    // =========================================================================
    // 4. CHORD TRANSPOSITION ENGINE
    // =========================================================================
    const NOTES_SHARP = ["C", "C#", "D", "D#", "E", "F", "F#", "G", "G#", "A", "A#", "B"];
    const NOTES_FLAT  = ["C", "Db", "D", "Eb", "E", "F", "Gb", "G", "Ab", "A", "Bb", "B"];

    function shiftNote(note, semitones) {
      let idx = NOTES_SHARP.indexOf(note);
      let useFlats = false;
      if (idx === -1) {
        idx = NOTES_FLAT.indexOf(note);
        useFlats = true;
      }
      if (idx === -1) return note;
      const newIdx = (idx + semitones + 120) % 12;
      return useFlats ? NOTES_FLAT[newIdx] : NOTES_SHARP[newIdx];
    }

    function transposeChords(text, semitones) {
      if (!text || !semitones) return text;
      return text.replace(
        /(?<![A-Za-z0-9#b])([A-G](?:#|b)?)((?:maj|min|m|dim|aug|sus|add)?[0-9]*(?:b5|#5|b9|#9|#11|b13)?(?:\/[A-G](?:#|b)?)?)(?=\s|\||$|\/)/g,
        (match, root, suffix) => {
          const nextRoot = shiftNote(root, semitones);
          let nextSuffix = suffix;
          if (suffix.includes("/")) {
            const [qual, bass] = suffix.split("/");
            nextSuffix = `${qual}/${shiftNote(bass, semitones)}`;
          }
          return `${nextRoot}${nextSuffix}`;
        }
      );
    }

    // =========================================================================
    // 5. HOME: SEARCH + AUTO-SUGGEST + SONG LIST
    // =========================================================================
    const songListEl = document.getElementById("songList");
    const searchInput = document.getElementById("searchInput");
    const suggestionsBox = document.getElementById("suggestionsBox");
    const songCountEl = document.getElementById("songCount");

    function renderHome(filterText = "") {
      songCountEl.textContent = `${songs.length} ${songs.length === 1 ? "song" : "songs"}`;
      const q = filterText.trim().toLowerCase();

      const filtered = songs.filter(
        (s) =>
          (s.title || "").toLowerCase().includes(q) ||
          String(s.voice || "").toLowerCase().includes(q) ||
          String(s.style || "").toLowerCase().includes(q) ||
          String(s.tempo || "").toLowerCase().includes(q) ||
          (s.chords || "").toLowerCase().includes(q)
      );

      if (filtered.length === 0) {
        songListEl.innerHTML = `
          <div class="empty-state">
            <p>No songs found.</p>
            <p style="font-size:0.8rem;margin-top:4px;">Tap <strong>+ Add Song</strong> to create a PSR E473 bypaulm setup.</p>
          </div>
        `;
        return;
      }

      songListEl.innerHTML = filtered
        .map(
          (song) => `
          <div class="song-card">
            <div class="song-header">
              <div class="song-title">${escapeHtml(song.title)}</div>
              <div class="song-actions">
                <button type="button" class="btn-action btn-play" data-play="${song.id}">▶ Play</button>
                <button type="button" class="btn-action" data-edit="${song.id}">Edit</button>
                <button type="button" class="btn-action btn-delete" data-delete="${song.id}">Delete</button>
              </div>
            </div>
            <div class="psr-badges">
              <div class="badge">
                <span class="badge-label">Voice</span>
                <span class="badge-val">${escapeHtml(String(song.voice))}</span>
              </div>
              <div class="badge style-badge">
                <span class="badge-label">Style</span>
                <span class="badge-val">${escapeHtml(String(song.style))}</span>
              </div>
              <div class="badge tempo-badge">
                <span class="badge-label">Tempo</span>
                <span class="badge-val">${escapeHtml(String(song.tempo || "-"))}</span>
              </div>
            </div>
            ${song.chords ? `<div class="chord-sheet">${escapeHtml(song.chords)}</div>` : ""}
          </div>
        `
        )
        .join("");
    }

    songListEl.addEventListener("click", async (e) => {
      const playId = e.target.closest("[data-play]")?.dataset.play;
      const editId = e.target.closest("[data-edit]")?.dataset.edit;
      const deleteId = e.target.closest("[data-delete]")?.dataset.delete;

      if (playId) {
        navigateTo({ page: "play", songId: playId });
      } else if (editId) {
        navigateTo({ page: "editor", songId: editId });
      } else if (deleteId) {
        if (confirm("Delete this song setup?")) {
          await removeSongFromFirebase(deleteId);
          renderHome(searchInput.value);
          showToast("Deleted");
        }
      }
    });

    searchInput.addEventListener("input", () => {
      const val = searchInput.value;
      renderHome(val);
      updateSuggestions(val);
    });

    function updateSuggestions(query) {
      const clean = query.trim().toLowerCase();
      if (!clean) {
        suggestionsBox.classList.remove("active");
        return;
      }

      const wordSet = new Set();
      songs.forEach((s) => {
        [s.title, String(s.voice), String(s.style), String(s.tempo || "")].forEach((field) => {
          (field || "").split(/\s+/).forEach((word) => {
            const w = word.trim();
            if (w && w.toLowerCase().includes(clean)) {
              wordSet.add(w);
            }
          });
        });
      });

      const titleMatches = songs.filter(
        (s) =>
          (s.title || "").toLowerCase().includes(clean) ||
          String(s.voice || "").toLowerCase().includes(clean) ||
          String(s.style || "").toLowerCase().includes(clean) ||
          String(s.tempo || "").toLowerCase().includes(clean)
      );

      if (titleMatches.length === 0 && wordSet.size === 0) {
        suggestionsBox.classList.remove("active");
        return;
      }

      const wordChips = Array.from(wordSet)
        .slice(0, 6)
        .map(
          (w) => `
          <div class="suggestion-item" data-suggest="${escapeHtml(w)}">
            <span>Word: <strong>${escapeHtml(w)}</strong></span>
            <span class="suggestion-meta">Auto-suggest</span>
          </div>
        `
        )
        .join("");

      const songItems = titleMatches
        .slice(0, 6)
        .map(
          (s) => `
          <div class="suggestion-item" data-suggest="${escapeHtml(s.title)}">
            <strong>${escapeHtml(s.title)}</strong>
            <span class="suggestion-meta">V:${escapeHtml(String(s.voice))} • S:${escapeHtml(String(s.style))} • T:${escapeHtml(String(s.tempo || "-"))}</span>
          </div>
        `
        )
        .join("");

      suggestionsBox.innerHTML = wordChips + songItems;
      suggestionsBox.classList.add("active");
    }

    suggestionsBox.addEventListener("click", (e) => {
      const item = e.target.closest("[data-suggest]");
      if (!item) return;
      const picked = item.dataset.suggest;
      searchInput.value = picked;
      suggestionsBox.classList.remove("active");
      renderHome(picked);
    });

    document.addEventListener("click", (e) => {
      if (!e.target.closest(".search-wrapper")) {
        suggestionsBox.classList.remove("active");
      }
    });

    // =========================================================================
    // 6. EDITOR: EDIT & SAVE FULL ENTRY (INCLUDING TEMPO) TO FIREBASE
    // =========================================================================
    const songForm = document.getElementById("songForm");
    const songIdInput = document.getElementById("songId");
    const titleInput = document.getElementById("titleInput");
    const voiceInput = document.getElementById("voiceInput");
    const styleInput = document.getElementById("styleInput");
    const tempoInput = document.getElementById("tempoInput");
    const chordsInput = document.getElementById("chordsInput");
    const saveSongBtn = document.getElementById("saveSongBtn");
    const editorTransVal = document.getElementById("editorTransVal");

    let editorSemitones = 0;

    function loadEditor(songId) {
      editorSemitones = 0;
      editorTransVal.textContent = "0";

      if (songId) {
        const song = songs.find((s) => s.id === songId);
        if (song) {
          songIdInput.value = song.id;
          titleInput.value = song.title || "";
          voiceInput.value = song.voice || "";
          styleInput.value = song.style || "";
          tempoInput.value = song.tempo || "";
          chordsInput.value = song.chords || "";
          return;
        }
      }

      songIdInput.value = "";
      titleInput.value = "";
      voiceInput.value = "";
      styleInput.value = "";
      tempoInput.value = "";
      chordsInput.value = "";
    }

    document.getElementById("editorTransUp").addEventListener("click", () => {
      editorSemitones += 1;
      editorTransVal.textContent = editorSemitones > 0 ? `+${editorSemitones}` : `${editorSemitones}`;
      chordsInput.value = transposeChords(chordsInput.value, 1);
    });

    document.getElementById("editorTransDown").addEventListener("click", () => {
      editorSemitones -= 1;
      editorTransVal.textContent = editorSemitones > 0 ? `+${editorSemitones}` : `${editorSemitones}`;
      chordsInput.value = transposeChords(chordsInput.value, -1);
    });

    songForm.addEventListener("submit", async (e) => {
      e.preventDefault();
      saveSongBtn.disabled = true;

      const entry = {
        id: songIdInput.value || `song-${Date.now()}`,
        title: titleInput.value.trim(),
        voice: voiceInput.value.trim(),
        style: styleInput.value.trim(),
        tempo: tempoInput.value.trim(),
        chords: chordsInput.value,
        updatedAt: Date.now()
      };

      try {
        await persistSongToFirebase(entry);
        showToast(hasFirebaseConfig ? "Saved to Firebase" : "Saved locally");
        goBackOneStep();
      } catch (err) {
        console.error(err);
        showToast("Error saving to Firebase");
      } finally {
        saveSongBtn.disabled = false;
      }
    });

    // =========================================================================
    // 7. PLAY MODE: ONLY TRANSPOSE + AND - ON TOP TABLE + MAXIMIZED CHORDS
    // =========================================================================
    const playChordsScreen = document.getElementById("playChordsScreen");
    const playTransVal = document.getElementById("playTransVal");

    let activePlaySong = null;
    let playSemitones = 0;

    function loadPlayScreen(songId) {
      const song = songs.find((s) => s.id === songId);
      if (!song) {
        goBackOneStep();
        return;
      }
      activePlaySong = song;
      playSemitones = 0;
      headerSub.textContent = "PLAY MODE";
      headerTitle.textContent = song.title;
      renderPlayChords();
    }

    function renderPlayChords() {
      if (!activePlaySong) return;
      playTransVal.textContent = playSemitones > 0 ? `+${playSemitones}` : `${playSemitones}`;
      playChordsScreen.textContent = transposeChords(activePlaySong.chords || "", playSemitones);
    }

    document.getElementById("playTransUp").addEventListener("click", () => {
      playSemitones += 1;
      renderPlayChords();
    });

    document.getElementById("playTransDown").addEventListener("click", () => {
      playSemitones -= 1;
      renderPlayChords();
    });

    // =========================================================================
    // 8. HELPERS
    // =========================================================================
    function escapeHtml(str) {
      return String(str).replace(/[&<>"']/g, (m) => ({
        "&": "&amp;",
        "<": "&lt;",
        ">": "&gt;",
        '"': "&quot;",
        "'": "&#39;"
      }[m]));
    }

    let toastTimer;
    function showToast(msg) {
      const toast = document.getElementById("toast");
      toast.textContent = msg;
      toast.classList.add("show");
      clearTimeout(toastTimer);
      toastTimer = setTimeout(() => toast.classList.remove("show"), 2000);
    }

    renderHome();
  </script>
</body>
</html>
