<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>PSR E473 bypaulm</title>
  <style>
    :root {
      --bg: #070c18;
      --surface: #111a2e;
      --surface-2: #18243d;
      --surface-hover: #223254;
      --border: #253554;
      --primary: #2563eb;
      --primary-hover: #1d4ed8;
      --accent: #38bdf8;
      --purple: #a855f7;
      --amber: #f59e0b;
      --chord-green: #4ade80;
      --text: #f8fafc;
      --text-muted: #94a3b8;
      --danger: #ef4444;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }

    body {
      background-color: var(--bg);
      color: var(--text);
      min-height: 100dvh;
      display: flex;
      flex-direction: column;
      overflow-x: hidden;
    }

    /* Compact Header */
    header {
      background: linear-gradient(180deg, #0b1324 0%, #09101f 100%);
      border-bottom: 1px solid var(--border);
      padding: 8px 12px;
      position: sticky;
      top: 0;
      z-index: 20;
      flex-shrink: 0;
    }

    .header-inner {
      max-width: 720px;
      margin: 0 auto;
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 6px;
    }

    .header-left {
      display: flex;
      align-items: center;
      gap: 8px;
      min-width: 0;
    }

    .header-actions {
      display: flex;
      align-items: center;
      gap: 5px;
      flex-shrink: 0;
    }

    .btn-back {
      background: var(--surface-2);
      color: var(--text);
      border: 1px solid var(--border);
      padding: 6px 10px;
      border-radius: 7px;
      font-weight: 700;
      font-size: 0.8rem;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      flex-shrink: 0;
    }

    .btn-back:hover {
      background: var(--surface-hover);
      border-color: var(--accent);
    }

    .brand {
      display: flex;
      flex-direction: column;
      min-width: 0;
    }

    .brand-tag {
      font-size: 0.58rem;
      font-weight: 800;
      letter-spacing: 1px;
      color: var(--accent);
      text-transform: uppercase;
    }

    .brand h1 {
      font-size: 1.02rem;
      font-weight: 800;
      color: var(--text);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .btn-add {
      background-color: var(--primary);
      color: #fff;
      border: none;
      padding: 6px 10px;
      border-radius: 7px;
      font-weight: 700;
      font-size: 0.76rem;
      cursor: pointer;
      flex-shrink: 0;
      white-space: nowrap;
    }

    .btn-add:hover {
      background-color: var(--primary-hover);
    }

    .btn-nav {
      background-color: var(--surface-2);
      color: var(--text);
      border: 1px solid var(--border);
      padding: 6px 9px;
      border-radius: 7px;
      font-weight: 700;
      font-size: 0.76rem;
      cursor: pointer;
      flex-shrink: 0;
      white-space: nowrap;
    }

    .btn-nav:hover {
      background-color: var(--surface-hover);
      border-color: var(--accent);
    }

    .sync-status {
      max-width: 720px;
      margin: 4px auto 0;
      font-size: 0.64rem;
      color: var(--text-muted);
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .status-dot {
      display: inline-block;
      width: 6px;
      height: 6px;
      border-radius: 50%;
      margin-right: 5px;
      background: var(--chord-green);
    }

    .status-dot.connecting {
      background: var(--amber);
    }

    /* Views */
    .view {
      display: none;
      width: 100%;
      max-width: 720px;
      margin: 0 auto;
      padding: 10px 12px 14px;
      flex: 1;
    }

    .view.active {
      display: flex;
      flex-direction: column;
    }

    /* Search & Nearest Auto-Suggest */
    .search-wrapper {
      position: relative;
      margin-bottom: 10px;
    }

    .search-input {
      width: 100%;
      padding: 9px 12px;
      background-color: var(--surface);
      border: 1px solid var(--border);
      border-radius: 9px;
      color: var(--text);
      font-size: 0.88rem;
      outline: none;
    }

    .search-input:focus {
      border-color: var(--accent);
    }

    .suggestions-box {
      position: absolute;
      top: calc(100% + 4px);
      left: 0;
      right: 0;
      background-color: var(--surface-2);
      border: 1px solid var(--border);
      border-radius: 9px;
      box-shadow: 0 12px 24px rgba(0, 0, 0, 0.75);
      z-index: 30;
      max-height: 220px;
      overflow-y: auto;
      display: none;
    }

    .suggestions-box.active {
      display: block;
    }

    .suggestion-item {
      padding: 9px 12px;
      cursor: pointer;
      border-bottom: 1px solid var(--border);
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 8px;
      font-size: 0.86rem;
      color: var(--text);
    }

    .suggestion-item:last-child {
      border-bottom: none;
    }

    .suggestion-item:hover {
      background-color: var(--surface-hover);
    }

    .suggestion-match {
      color: var(--accent);
      font-weight: 800;
    }

    .suggestion-meta {
      font-size: 0.72rem;
      color: var(--text-muted);
      white-space: nowrap;
    }

    /* Accordion Song List (Alphabetical, Tap to Expand) */
    .song-list {
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    .song-card {
      background-color: var(--surface);
      border: 1px solid var(--border);
      border-radius: 10px;
      overflow: hidden;
    }

    .song-card.expanded {
      border-color: var(--accent);
    }

    .song-row-trigger {
      width: 100%;
      background: transparent;
      border: none;
      color: var(--text);
      padding: 11px 12px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 10px;
      text-align: left;
      cursor: pointer;
    }

    .song-row-trigger:hover {
      background-color: var(--surface-hover);
    }

    .song-title {
      font-size: 0.96rem;
      font-weight: 800;
      color: var(--text);
      min-width: 0;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .chevron {
      font-size: 0.78rem;
      color: var(--text-muted);
      flex-shrink: 0;
      transition: transform 0.15s ease;
    }

    .song-card.expanded .chevron,
    .setlist-card.expanded .chevron {
      transform: rotate(180deg);
      color: var(--accent);
    }

    .song-drawer {
      display: none;
      padding: 0 12px 12px;
      border-top: 1px solid var(--border);
      background-color: #0d1526;
    }

    .song-card.expanded .song-drawer {
      display: block;
    }

    .song-drawer-actions {
      display: flex;
      justify-content: flex-end;
      gap: 6px;
      padding: 9px 0 8px;
    }

    .btn-action {
      background: var(--surface-2);
      color: var(--text);
      border: 1px solid var(--border);
      padding: 5px 10px;
      border-radius: 6px;
      font-size: 0.75rem;
      font-weight: 700;
      cursor: pointer;
    }

    .btn-action:hover {
      background: var(--surface-hover);
      border-color: var(--accent);
    }

    .btn-play {
      background: rgba(56, 189, 248, 0.14);
      color: var(--accent);
      border-color: rgba(56, 189, 248, 0.45);
    }

    .btn-delete:hover {
      color: #fca5a5;
      border-color: var(--danger);
    }

    .psr-badges {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 6px;
      margin-bottom: 8px;
    }

    .badge {
      background-color: var(--bg);
      border: 1px solid var(--border);
      border-left: 2px solid var(--accent);
      padding: 5px 8px;
      border-radius: 6px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      font-size: 0.78rem;
      min-width: 0;
    }

    .badge.style-badge {
      border-left-color: var(--purple);
    }

    .badge.tempo-badge {
      border-left-color: var(--amber);
    }

    .badge-label {
      font-size: 0.6rem;
      font-weight: 800;
      text-transform: uppercase;
      color: var(--text-muted);
    }

    .badge-val {
      font-weight: 700;
      color: var(--text);
    }

    /* Simplified Editor Top Section */
    .simple-editor-header {
      display: flex;
      flex-direction: column;
      gap: 6px;
      margin-bottom: 8px;
      flex-shrink: 0;
    }

    .title-transpose-row {
      display: flex;
      gap: 6px;
      align-items: center;
    }

    .clean-input {
      width: 100%;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 7px 10px;
      color: var(--text);
      font-size: 0.88rem;
      font-weight: 700;
      outline: none;
    }

    .clean-input::placeholder {
      color: var(--text-muted);
      opacity: 0.55;
      font-weight: 500;
    }

    .clean-input:focus {
      border-color: var(--accent);
    }

    .three-col-inputs {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 6px;
    }

    .field-stack {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 4px 8px 5px;
      display: flex;
      flex-direction: column;
    }

    .field-stack.voice-stack {
      border-left: 2px solid var(--accent);
    }

    .field-stack.style-stack {
      border-left: 2px solid var(--purple);
    }

    .field-stack.tempo-stack {
      border-left: 2px solid var(--amber);
    }

    .field-stack:focus-within {
      border-color: var(--accent);
    }

    .field-stack label {
      font-size: 0.56rem;
      font-weight: 800;
      text-transform: uppercase;
      letter-spacing: 0.6px;
      color: var(--text-muted);
      margin-bottom: 1px;
    }

    .field-stack input {
      width: 100%;
      background: transparent;
      border: none;
      color: var(--text);
      font-size: 0.9rem;
      font-weight: 800;
      outline: none;
    }

    .field-stack input::placeholder {
      color: var(--text-muted);
      opacity: 0.4;
    }

    /* Transpose Box */
    .transpose-compact {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 4px 6px;
      display: flex;
      align-items: center;
      gap: 5px;
      flex-shrink: 0;
    }

    .btn-trans {
      background: var(--surface-2);
      color: var(--text);
      border: 1px solid var(--border);
      width: 26px;
      height: 26px;
      border-radius: 6px;
      font-size: 0.95rem;
      font-weight: 800;
      line-height: 1;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      justify-content: center;
    }

    .btn-trans:hover {
      background: var(--primary);
      color: #fff;
      border-color: var(--primary);
    }

    .transpose-indicator {
      min-width: 24px;
      text-align: center;
      font-weight: 800;
      color: var(--accent);
      font-size: 0.8rem;
    }

    .play-top-bar {
      display: flex;
      justify-content: flex-end;
      margin-bottom: 8px;
      flex-shrink: 0;
    }

    /* Chords Sheet in Green Font */
    .chord-sheet {
      width: 100%;
      background-color: #050912;
      border: 1px solid #1b2842;
      border-radius: 10px;
      padding: 11px 12px;
      font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, "Liberation Mono", "Courier New", monospace;
      font-size: 0.9rem;
      line-height: 1.5;
      letter-spacing: 0.2px;
      color: #cbd5e1;
      white-space: pre-wrap;
      word-wrap: break-word;
    }

    .chord-token {
      color: var(--chord-green);
      font-weight: 700;
    }

    .chord-sheet.maximized {
      flex: 1;
      height: 100%;
      min-height: 0;
    }

    textarea.chord-sheet {
      color: var(--chord-green);
      resize: none;
      outline: none;
      display: block;
    }

    textarea.chord-sheet:focus {
      border-color: var(--accent);
    }

    #songForm {
      display: flex;
      flex-direction: column;
      flex: 1;
    }

    .editor-footer {
      display: flex;
      justify-content: flex-end;
      margin-top: 8px;
      flex-shrink: 0;
    }

    .btn-save {
      background: var(--primary);
      color: #fff;
      border: none;
      padding: 8px 20px;
      border-radius: 8px;
      font-size: 0.88rem;
      font-weight: 800;
      cursor: pointer;
    }

    .btn-save:hover {
      background: var(--primary-hover);
    }

    .btn-save:disabled {
      opacity: 0.6;
      cursor: not-allowed;
    }

    /* Setlist List View (Tap to Expand, 1 Unified Table) */
    .setlist-stack {
      display: flex;
      flex-direction: column;
      gap: 7px;
    }

    .setlist-card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 10px;
      overflow: hidden;
    }

    .setlist-card.expanded {
      border-color: var(--accent);
    }

    .setlist-trigger {
      width: 100%;
      background: transparent;
      border: none;
      color: var(--text);
      padding: 11px 12px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 10px;
      text-align: left;
      cursor: pointer;
    }

    .setlist-trigger:hover {
      background: var(--surface-hover);
    }

    .setlist-header-info {
      min-width: 0;
      flex: 1;
    }

    .setlist-name {
      font-size: 0.96rem;
      font-weight: 800;
      color: var(--text);
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .setlist-mod {
      font-size: 0.68rem;
      color: var(--text-muted);
      margin-top: 2px;
    }

    .setlist-drawer {
      display: none;
      padding: 0 12px 12px;
      border-top: 1px solid var(--border);
      background-color: #0d1526;
    }

    .setlist-card.expanded .setlist-drawer {
      display: block;
    }

    .setlist-drawer-actions {
      display: flex;
      justify-content: flex-end;
      gap: 6px;
      padding: 9px 0 8px;
    }

    /* Single Unified Table for All Categories */
    .setlist-table {
      width: 100%;
      border-collapse: collapse;
      background: var(--bg);
      border: 1px solid var(--border);
      border-radius: 8px;
      overflow: hidden;
      table-layout: fixed;
    }

    .setlist-table tr {
      border-bottom: 1px solid var(--border);
    }

    .setlist-table tr:last-child {
      border-bottom: none;
    }

    .setlist-table tr.playable-row {
      cursor: pointer;
    }

    .setlist-table tr.playable-row:hover {
      background: var(--surface-hover);
    }

    .setlist-table td {
      padding: 9px 10px;
      vertical-align: middle;
    }

    .td-cat {
      width: 32%;
      font-size: 0.66rem;
      font-weight: 800;
      text-transform: uppercase;
      letter-spacing: 0.6px;
      color: var(--accent);
      border-left: 3px solid var(--accent);
      border-right: 1px solid var(--border);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .td-song {
      width: 68%;
      font-size: 0.85rem;
      font-weight: 700;
      color: var(--text);
      word-break: break-word;
    }

    .td-song.empty {
      color: var(--text-muted);
      font-weight: 500;
      font-style: italic;
    }

    /* +Setlist Modal */
    .modal-backdrop {
      position: fixed;
      inset: 0;
      background: rgba(2, 6, 15, 0.82);
      display: none;
      align-items: center;
      justify-content: center;
      padding: 12px;
      z-index: 50;
    }

    .modal-backdrop.open {
      display: flex;
    }

    .modal-card {
      width: 100%;
      max-width: 480px;
      max-height: 90dvh;
      overflow-y: auto;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 14px;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .modal-head {
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .modal-head h2 {
      font-size: 1rem;
      font-weight: 800;
    }

    .modal-close {
      background: var(--surface-2);
      color: var(--text);
      border: 1px solid var(--border);
      border-radius: 6px;
      padding: 3px 9px;
      font-size: 0.85rem;
      font-weight: 700;
      cursor: pointer;
    }

    .slot-list {
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    .slot-row {
      background: var(--bg);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 7px 9px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 8px;
    }

    .slot-info {
      min-width: 0;
      flex: 1;
    }

    .slot-cat {
      font-size: 0.65rem;
      font-weight: 800;
      text-transform: uppercase;
      letter-spacing: 0.6px;
      color: var(--accent);
    }

    .slot-song {
      font-size: 0.84rem;
      font-weight: 700;
      color: var(--text);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .btn-plus-slot {
      background: var(--surface-2);
      color: var(--accent);
      border: 1px solid var(--border);
      border-radius: 6px;
      padding: 5px 10px;
      font-size: 0.82rem;
      font-weight: 800;
      cursor: pointer;
      flex-shrink: 0;
    }

    .btn-plus-slot:hover {
      background: var(--surface-hover);
      border-color: var(--accent);
    }

    .picker-box {
      background: var(--surface-2);
      border: 1px solid var(--accent);
      border-radius: 9px;
      padding: 8px;
      display: none;
      flex-direction: column;
      gap: 6px;
    }

    .picker-box.open {
      display: flex;
    }

    .picker-list {
      max-height: 150px;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      gap: 4px;
    }

    .picker-item {
      background: var(--bg);
      border: 1px solid var(--border);
      border-radius: 6px;
      padding: 6px 9px;
      font-size: 0.82rem;
      font-weight: 700;
      color: var(--text);
      cursor: pointer;
      text-align: left;
    }

    .picker-item:hover {
      border-color: var(--accent);
      background: var(--surface);
    }

    .modal-actions {
      display: flex;
      justify-content: flex-end;
      gap: 8px;
      margin-top: 4px;
    }

    .empty-state {
      text-align: center;
      padding: 32px 16px;
      background: var(--surface);
      border: 1px dashed var(--border);
      border-radius: 10px;
      color: var(--text-muted);
      font-size: 0.88rem;
    }

    .toast {
      position: fixed;
      bottom: 16px;
      left: 50%;
      transform: translateX(-50%);
      background: var(--surface-2);
      color: var(--text);
      border: 1px solid var(--accent);
      padding: 7px 15px;
      border-radius: 999px;
      font-size: 0.8rem;
      font-weight: 700;
      z-index: 100;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.2s;
    }

    .toast.show {
      opacity: 1;
    }
  </style>
</head>
<body>

  <header>
    <div class="header-inner">
      <div class="header-left">
        <button type="button" class="btn-back" id="backBtn" style="display: none;">← Back</button>
        <div class="brand">
          <span class="brand-tag" id="headerSub">YAMAHA KEYBOARD MANAGER</span>
          <h1 id="headerTitle">PSR E473 bypaulm</h1>
        </div>
      </div>
      <div class="header-actions" id="homeActions">
        <button type="button" class="btn-nav" id="openSetlistModalBtn">+Setlist</button>
        <button type="button" class="btn-nav" id="openSetlistsViewBtn">Setlist</button>
        <button type="button" class="btn-add" id="addSongBtn">+ Add Song</button>
      </div>
    </div>
    <div class="sync-status">
      <span id="syncIndicator"><span class="status-dot connecting" id="statusDot"></span>Signing in to mobile-presenter...</span>
      <span id="songCount">0 songs</span>
    </div>
  </header>

  <!-- HOME PAGE (Alphabetical List, Tap to Expand) -->
  <section id="homeView" class="view active">
    <div class="search-wrapper">
      <input
        type="text"
        id="searchInput"
        class="search-input"
        placeholder="Search saved songs..."
        autocomplete="off"
      />
      <div class="suggestions-box" id="suggestionsBox"></div>
    </div>

    <div class="song-list" id="songList"></div>
  </section>

  <!-- SETLISTS PAGE (Sorted by Modified, Tap to Expand) -->
  <section id="setlistsView" class="view">
    <div class="setlist-stack" id="setlistsContainer"></div>
  </section>

  <!-- SIMPLIFIED ADD / EDIT SONG PAGE -->
  <section id="editorView" class="view">
    <form id="songForm">
      <input type="hidden" id="songId" />

      <div class="simple-editor-header">
        <!-- Row 1: Song Title + Transpose -->
        <div class="title-transpose-row">
          <input
            type="text"
            id="titleInput"
            class="clean-input"
            placeholder="Song Title"
            required
          />
          <div class="transpose-compact" title="Transpose">
            <button type="button" class="btn-trans" id="editorTransDown">-</button>

  <div class="toast" id="toast"></div>

  <!-- Firebase SDK v13.4.0 (Modular ES Module) -->
  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/13.4.0/firebase-app.js";
    import {
      getAuth,
      signInAnonymously,
      onAuthStateChanged
    } from "https://www.gstatic.com/firebasejs/13.4.0/firebase-auth.js";
    import {
      getDatabase,
      ref,
      set,
      remove,
      onValue
    } from "https://www.gstatic.com/firebasejs/13.4.0/firebase-database.js";

    // =========================================================================
    // 1. YOUR FIREBASE CONFIG (mobile-presenter)
    // =========================================================================
    const firebaseConfig = {
      apiKey: "AIzaSyA6yuHjPrn3SVsXeJSnA9gzJ6tHw9oGdnA",
      authDomain: "mobile-presenter.firebaseapp.com",
      databaseURL: "https://mobile-presenter-default-rtdb.asia-southeast1.firebasedatabase.app",
      projectId: "mobile-presenter",
      storageBucket: "mobile-presenter.firebasestorage.app",
      messagingSenderId: "386403722965",
      appId: "1:386403722965:web:efd186e0e3e67c5218a45c",
      measurementId: "G-WBMG9Q2SQ6"
    };

    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);
    const rtdb = getDatabase(app);
    const songsRef = ref(rtdb, "psr_e473_songs");
    const setlistsRef = ref(rtdb, "psr_e473_setlists");

    const syncIndicator = document.getElementById("syncIndicator");

    // =========================================================================
    // 2. AUTH + REAL-TIME FIREBASE SYNC (SONGS & SETLISTS) + LOCAL CACHE
    // =========================================================================
    const SONGS_CACHE_KEY = "psr_e473_bypaulm_cache_v1";
    const SETLISTS_CACHE_KEY = "psr_e473_bypaulm_setlists_v1";

    let songs = sortSongsAlphabetically(loadCache(SONGS_CACHE_KEY));
    let setlists = sortSetlistsByModified(loadCache(SETLISTS_CACHE_KEY));
    let dbListenersStarted = false;

    let expandedSongId = null;
    let expandedSetlistId = null;

    function loadCache(key) {
      try {
        const raw = localStorage.getItem(key);
        if (!raw) return [];
        const parsed = JSON.parse(raw);
        return Array.isArray(parsed) ? parsed : [];
      } catch {
        return [];
      }
    }

    function saveCache(key, list) {
      try {
        localStorage.setItem(key, JSON.stringify(list));
      } catch (e) {
        console.warn("Local cache save skipped:", e);
      }
    }

    function sortSongsAlphabetically(list) {
      return [...list].sort((a, b) =>
        (a.title || "").localeCompare(b.title || "", undefined, { sensitivity: "base" })
      );
    }

    function sortSetlistsByModified(list) {
      return [...list].sort(
        (a, b) => (b.modifiedAt || b.updatedAt || 0) - (a.modifiedAt || a.updatedAt || 0)
      );
    }

    function startDbListeners() {
      if (dbListenersStarted) return;
      dbListenersStarted = true;

      onValue(
        songsRef,
        (snapshot) => {
          const val = snapshot.val();
          const cloudSongs = [];
          if (val && typeof val === "object") {
            Object.entries(val).forEach(([id, data]) => {
              if (data && typeof data === "object") {
                cloudSongs.push({ id, ...data });
              }
            });
          }
          songs = sortSongsAlphabetically(cloudSongs);
          saveCache(SONGS_CACHE_KEY, songs);
          syncIndicator.innerHTML = `<span class="status-dot"></span>Firebase Connected (mobile-presenter)`;
          renderHome(searchInput.value);
          renderSetlistsView();
        },
        (error) => {
          console.error("Firebase Realtime Database error:", error);
          syncIndicator.innerHTML = `<span class="status-dot connecting"></span>Permission Denied — Add RTDB rules`;
        }
      );

      onValue(
        setlistsRef,
        (snapshot) => {
          const val = snapshot.val();
          const cloudSetlists = [];
          if (val && typeof val === "object") {
            Object.entries(val).forEach(([id, data]) => {
              if (data && typeof data === "object") {
                cloudSetlists.push({ id, ...data });
              }
            });
          }
          setlists = sortSetlistsByModified(cloudSetlists);
          saveCache(SETLISTS_CACHE_KEY, setlists);
          renderSetlistsView();
        },
        (error) => {
          console.error("Firebase setlists error:", error);
        }
      );
    }

    onAuthStateChanged(auth, async (user) => {
      if (user) {
        startDbListeners();
      } else {
        try {
          await signInAnonymously(auth);
        } catch (err) {
          console.error("Anonymous sign-in error:", err);
          syncIndicator.innerHTML = `<span class="status-dot connecting"></span>Enable Anonymous Auth in Firebase`;
        }
      }
    });

    async function persistSongToFirebase(song) {
      if (!auth.currentUser) {
        await signInAnonymously(auth);
      }

      const payload = {
        title: song.title,
        voice: song.voice,
        style: song.style,
        tempo: song.tempo,
        chords: song.chords,
        updatedAt: Date.now()
      };

      await set(ref(rtdb, `psr_e473_songs/${song.id}`), payload);

      const fullSong = { id: song.id, ...payload };
      const nextList = songs.some((s) => s.id === song.id)
        ? songs.map((s) => (s.id === song.id ? fullSong : s))
        : [...songs, fullSong];
      songs = sortSongsAlphabetically(nextList);
      saveCache(SONGS_CACHE_KEY, songs);
    }

    async function removeSongFromFirebase(id) {
      if (!auth.currentUser) {
        await signInAnonymously(auth);
      }

      await remove(ref(rtdb, `psr_e473_songs/${id}`));

      songs = songs.filter((s) => s.id !== id);
      if (expandedSongId === id) expandedSongId = null;
      saveCache(SONGS_CACHE_KEY, songs);
    }

    async function persistSetlistToFirebase(setlistObj) {
      if (!auth.currentUser) {
        await signInAnonymously(auth);
      }

      const payload = {
        name: setlistObj.name,
        slots: setlistObj.slots,
        modifiedAt: Date.now()
      };

      await set(ref(rtdb, `psr_e473_setlists/${setlistObj.id}`), payload);

      const fullSetlist = { id: setlistObj.id, ...payload };
      const nextList = setlists.some((item) => item.id === setlistObj.id)
        ? setlists.map((item) => (item.id === setlistObj.id ? fullSetlist : item))
        : [fullSetlist, ...setlists];

      setlists = sortSetlistsByModified(nextList);
      saveCache(SETLISTS_CACHE_KEY, setlists);
    }

    async function removeSetlistFromFirebase(id) {
      if (!auth.currentUser) {
        await signInAnonymously(auth);
      }

      await remove(ref(rtdb, `psr_e473_setlists/${id}`));

      setlists = setlists.filter((item) => item.id !== id);
      if (expandedSetlistId === id) expandedSetlistId = null;
      saveCache(SETLISTS_CACHE_KEY, setlists);
    }

    // =========================================================================
    // 3. NAVIGATION & PHONE BACK BUTTON SYNC
    // =========================================================================
    let navStack = [{ page: "home" }];

    const backBtn = document.getElementById("backBtn");
    const homeActions = document.getElementById("homeActions");
    const addSongBtn = document.getElementById("addSongBtn");
    const openSetlistsViewBtn = document.getElementById("openSetlistsViewBtn");
    const homeView = document.getElementById("homeView");
    const setlistsView = document.getElementById("setlistsView");
    const editorView = document.getElementById("editorView");
    const playView = document.getElementById("playView");
    const headerTitle = document.getElementById("headerTitle");
    const headerSub = document.getElementById("headerSub");

    history.replaceState({ stackIndex: 0 }, "", "#home");

    function navigateTo(nextState) {
      const currentTop = navStack[navStack.length - 1];
      if (
        currentTop &&
        currentTop.page === nextState.page &&
        currentTop.songId === nextState.songId
      ) {
        applyRoute(nextState);
        return;
      }

      navStack.push(nextState);
      const stackIndex = navStack.length - 1;
      history.pushState({ stackIndex }, "", `#${nextState.page}`);
      applyRoute(nextState);
    }

    function goBackOneStep() {
      if (navStack.length > 1) {
        history.back();
      } else {
        applyRoute({ page: "home" });
      }
    }

    window.addEventListener("popstate", (event) => {
      if (event.state && typeof event.state.stackIndex === "number") {
        const targetIdx = Math.max(0, Math.min(event.state.stackIndex, navStack.length - 1));
        navStack = navStack.slice(0, targetIdx + 1);
      } else if (navStack.length > 1) {
        navStack.pop();
      } else {
        navStack = [{ page: "home" }];
      }
      applyRoute(navStack[navStack.length - 1]);
    });

    function applyRoute(state) {
      homeView.classList.remove("active");
      setlistsView.classList.remove("active");
      editorView.classList.remove("active");
      playView.classList.remove("active");

      if (state.page === "home") {
        homeView.classList.add("active");
        backBtn.style.display = "none";
        homeActions.style.display = "flex";
        headerSub.textContent = "YAMAHA KEYBOARD MANAGER";
        headerTitle.textContent = "PSR E473 bypaulm";
        renderHome(searchInput.value);
      } else if (state.page === "setlists") {
        setlistsView.classList.add("active");
        backBtn.style.display = "inline-flex";
        homeActions.style.display = "none";
        headerSub.textContent = "SORTED BY MODIFIED";
        headerTitle.textContent = "Setlists";
        renderSetlistsView();
      } else if (state.page === "editor") {
        editorView.classList.add("active");
        backBtn.style.display = "inline-flex";
        homeActions.style.display = "none";
        headerSub.textContent = "PSR E473 BYPAULM";
        headerTitle.textContent = state.songId ? "Edit Song" : "Add Song";
        loadEditor(state.songId || null);
      } else if (state.page === "play") {
        playView.classList.add("active");
        backBtn.style.display = "inline-flex";
        homeActions.style.display = "none";
        loadPlayScreen(state.songId);
      }
    }

    backBtn.addEventListener("click", goBackOneStep);
    addSongBtn.addEventListener("click", () => navigateTo({ page: "editor", songId: null }));
    openSetlistsViewBtn.addEventListener("click", () => navigateTo({ page: "setlists" }));

    // =========================================================================
    // 4. CHORD HIGHLIGHTING (GREEN ONLY ON CHORDS) & TRANSPOSITION ENGINE
    // =========================================================================
    const NOTES_SHARP = ["C", "C#", "D", "D#", "E", "F", "F#", "G", "G#", "A", "A#", "B"];
    const NOTES_FLAT  = ["C", "Db", "D", "Eb", "E", "F", "Gb", "G", "Ab", "A", "Bb", "B"];
    const CHORD_REGEX = /(?<![A-Za-z0-9#b])([A-G](?:#|b)?)((?:maj|min|m|dim|aug|sus|add)?[0-9]*(?:b5|#5|b9|#9|#11|b13)?(?:\/[A-G](?:#|b)?)?)(?=\s|\||$|\/)/g;

    function formatChordsHtml(text) {
      const escaped = escapeHtml(text || "");
      return escaped.replace(CHORD_REGEX, (match) => `<span class="chord-token">${match}</span>`);
    }

    function shiftNote(note, semitones) {
      let idx = NOTES_SHARP.indexOf(note);
      let useFlats = false;
      if (idx === -1) {
        idx = NOTES_FLAT.indexOf(note);
        useFlats = true;
      }
      if (idx === -1) return note;
      const newIdx = (idx + semitones + 120) % 12;
      return useFlats ? NOTES_FLAT[newIdx] : NOTES_SHARP[newIdx];
    }

    function transposeChords(text, semitones) {
      if (!text || !semitones) return text;
      return text.replace(CHORD_REGEX, (match, root, suffix) => {
        const nextRoot = shiftNote(root, semitones);
        let nextSuffix = suffix;
        if (suffix.includes("/")) {
          const [qual, bass] = suffix.split("/");
          nextSuffix = `${qual}/${shiftNote(bass, semitones)}`;
        }
        return `${nextRoot}${nextSuffix}`;
      });
    }

    // =========================================================================
    // 5. HOME: ALPHABETICAL LIST + TAP TO SHOW CONTENT + AUTO-SUGGEST
    // =========================================================================
    const songListEl = document.getElementById("songList");
    const searchInput = document.getElementById("searchInput");
    const suggestionsBox = document.getElementById("suggestionsBox");
    const songCountEl = document.getElementById("songCount");

    function renderHome(filterText = "") {
      const sortedSongs = sortSongsAlphabetically(songs);
      songCountEl.textContent = `${sortedSongs.length} ${sortedSongs.length === 1 ? "song" : "songs"}`;
      const q = filterText.trim().toLowerCase();

      const filtered = sortedSongs.filter(
        (s) =>
          (s.title || "").toLowerCase().includes(q) ||
          String(s.voice || "").toLowerCase().includes(q) ||
          String(s.style || "").toLowerCase().includes(q) ||
          String(s.tempo || "").toLowerCase().includes(q) ||
          (s.chords || "").toLowerCase().includes(q)
      );

      if (filtered.length === 0) {
        songListEl.innerHTML = `
          <div class="empty-state">
            <p>No songs found.</p>
            <p style="font-size:0.78rem;margin-top:4px;">Tap <strong>+ Add Song</strong> to save a song to Firebase.</p>
          </div>
        `;
        return;
      }

      songListEl.innerHTML = filtered
        .map((song) => {
          const isExpanded = expandedSongId === song.id;
          return `
            <div class="song-card ${isExpanded ? "expanded" : ""}">
              <button type="button" class="song-row-trigger" data-toggle-song="${song.id}">
                <span class="song-title">${escapeHtml(song.title)}</span>
                <span class="chevron">▼</span>
              </button>
              <div class="song-drawer">
                <div class="song-drawer-actions">
                  <button type="button" class="btn-action btn-play" data-play="${song.id}">▶ Play</button>
                  <button type="button" class="btn-action" data-edit="${song.id}">Edit</button>
                  <button type="button" class="btn-action btn-delete" data-delete="${song.id}">Delete</button>
                </div>
                <div class="psr-badges">
                  <div class="badge">
                    <span class="badge-label">Voice</span>
                    <span class="badge-val">${escapeHtml(String(song.voice))}</span>
                  </div>
                  <div class="badge style-badge">
                    <span class="badge-label">Style</span>
                    <span class="badge-val">${escapeHtml(String(song.style))}</span>
                  </div>
                  <div class="badge tempo-badge">
                    <span class="badge-label">Tempo</span>
                    <span class="badge-val">${escapeHtml(String(song.tempo || "-"))}</span>
                  </div>
                </div>
                ${song.chords ? `<div class="chord-sheet">${formatChordsHtml(song.chords)}</div>` : ""}
              </div>
            </div>
          `;
        })
        .join("");
    }

    songListEl.addEventListener("click", async (e) => {
      const toggleId = e.target.closest("[data-toggle-song]")?.dataset.toggleSong;
      const playId = e.target.closest("[data-play]")?.dataset.play;
      const editId = e.target.closest("[data-edit]")?.dataset.edit;
      const deleteId = e.target.closest("[data-delete]")?.dataset.delete;

      if (toggleId) {
        expandedSongId = expandedSongId === toggleId ? null : toggleId;
        renderHome(searchInput.value);
      } else if (playId) {
        navigateTo({ page: "play", songId: playId });
      } else if (editId) {
        navigateTo({ page: "editor", songId: editId });
      } else if (deleteId) {
        if (confirm("Delete this song setup?")) {
          await removeSongFromFirebase(deleteId);
          renderHome(searchInput.value);
          showToast("Deleted from Firebase");
        }
      }
    });

    searchInput.addEventListener("input", () => {
      const val = searchInput.value;
      renderHome(val);
      updateSuggestions(val);
    });

    function getMatchScore(song, cleanQuery) {
      const title = (song.title || "").toLowerCase();
      const voice = String(song.voice || "").toLowerCase();
      const style = String(song.style || "").toLowerCase();
      const tempo = String(song.tempo || "").toLowerCase();

      if (title.startsWith(cleanQuery)) return 1;
      if (title.split(/\s+/).some((w) => w.startsWith(cleanQuery))) return 2;
      if (title.includes(cleanQuery)) return 3;
      if (voice.startsWith(cleanQuery) || style.startsWith(cleanQuery) || tempo.startsWith(cleanQuery)) return 4;
      if (voice.includes(cleanQuery) || style.includes(cleanQuery) || tempo.includes(cleanQuery)) return 5;
      return 99;
    }

    function highlightNearest(text, query) {
      const safeText = escapeHtml(text);
      const idx = text.toLowerCase().indexOf(query);
      if (idx === -1) return safeText;
      const before = escapeHtml(text.slice(0, idx));
      const match = escapeHtml(text.slice(idx, idx + query.length));
      const after = escapeHtml(text.slice(idx + query.length));
      return `${before}<span class="suggestion-match">${match}</span>${after}`;
    }

    function updateSuggestions(query) {
      const clean = query.trim().toLowerCase();
      if (!clean) {
        suggestionsBox.classList.remove("active");
        return;
      }

      const nearestSongs = songs
        .map((s) => ({ song: s, score: getMatchScore(s, clean) }))
        .filter((item) => item.score < 99)
        .sort((a, b) => a.score - b.score || a.song.title.localeCompare(b.song.title))
        .slice(0, 8);

      if (nearestSongs.length === 0) {
        suggestionsBox.classList.remove("active");
        return;
      }

      suggestionsBox.innerHTML = nearestSongs
        .map(
          ({ song }) => `
          <div class="suggestion-item" data-suggest="${escapeHtml(song.title)}" data-suggest-id="${song.id}">
            <span>${highlightNearest(song.title, clean)}</span>
            <span class="suggestion-meta">V:${escapeHtml(String(song.voice))} • S:${escapeHtml(String(song.style))} • T:${escapeHtml(String(song.tempo || "-"))}</span>
          </div>
        `
        )
        .join("");

      suggestionsBox.classList.add("active");
    }

    suggestionsBox.addEventListener("click", (e) => {
      const item = e.target.closest("[data-suggest]");
      if (!item) return;
      const picked = item.dataset.suggest;
      expandedSongId = item.dataset.suggestId || null;
      searchInput.value = picked;
      suggestionsBox.classList.remove("active");
      renderHome(picked);
    });

    document.addEventListener("click", (e) => {
      if (!e.target.closest(".search-wrapper")) {
        suggestionsBox.classList.remove("active");
      }
    });

    // =========================================================================
    // 6. EDITOR: EDIT & SAVE FULL ENTRY TO FIREBASE
    // =========================================================================
    const songForm = document.getElementById("songForm");
    const songIdInput = document.getElementById("songId");
    const titleInput = document.getElementById("titleInput");
    const voiceInput = document.getElementById("voiceInput");
    const styleInput = document.getElementById("styleInput");
    const tempoInput = document.getElementById("tempoInput");
    const chordsInput = document.getElementById("chordsInput");
    const saveSongBtn = document.getElementById("saveSongBtn");
    const editorTransVal = document.getElementById("editorTransVal");

    let editorSemitones = 0;

    function loadEditor(songId) {
      editorSemitones = 0;
      editorTransVal.textContent = "0";

      if (songId) {
        const song = songs.find((s) => s.id === songId);
        if (song) {
          songIdInput.value = song.id;
          titleInput.value = song.title || "";
          voiceInput.value = song.voice || "";
          styleInput.value = song.style || "";
          tempoInput.value = song.tempo || "";
          chordsInput.value = song.chords || "";
          return;
        }
      }

      songIdInput.value = "";
      titleInput.value = "";
      voiceInput.value = "";
      styleInput.value = "";
      tempoInput.value = "";
      chordsInput.value = "";
    }

    document.getElementById("editorTransUp").addEventListener("click", () => {
      editorSemitones += 1;
      editorTransVal.textContent = editorSemitones > 0 ? `+${editorSemitones}` : `${editorSemitones}`;
      chordsInput.value = transposeChords(chordsInput.value, 1);
    });

    document.getElementById("editorTransDown").addEventListener("click", () => {
      editorSemitones -= 1;
      editorTransVal.textContent = editorSemitones > 0 ? `+${editorSemitones}` : `${editorSemitones}`;
      chordsInput.value = transposeChords(chordsInput.value, -1);
    });

    songForm.addEventListener("submit", async (e) => {
      e.preventDefault();
      if (saveSongBtn.disabled) return;
      saveSongBtn.disabled = true;

      const entry = {
        id: songIdInput.value || `song-${Date.now()}`,
        title: titleInput.value.trim(),
        voice: voiceInput.value.trim(),
        style: styleInput.value.trim(),
        tempo: tempoInput.value.trim(),
        chords: chordsInput.value
      };

      try {
        await persistSongToFirebase(entry);
        expandedSongId = entry.id;
        showToast("Saved to Firebase");
        goBackOneStep();
      } catch (err) {
        console.error(err);
        showToast("Save failed — check Firebase rules");
      } finally {
        saveSongBtn.disabled = false;
      }
    });

    // =========================================================================
    // 7. PLAY MODE: ONLY TRANSPOSE + AND - ON TOP + GREEN CHORDS
    // =========================================================================
    const playChordsScreen = document.getElementById("playChordsScreen");
    const playTransVal = document.getElementById("playTransVal");

    let activePlaySong = null;
    let playSemitones = 0;

    function loadPlayScreen(songId) {
      const song = songs.find((s) => s.id === songId);
      if (!song) {
        goBackOneStep();
        return;
      }
      activePlaySong = song;
      playSemitones = 0;
      headerSub.textContent = "PLAY MODE";
      headerTitle.textContent = song.title;
      renderPlayChords();
    }

    function renderPlayChords() {
      if (!activePlaySong) return;
      playTransVal.textContent = playSemitones > 0 ? `+${playSemitones}` : `${playSemitones}`;
      const transposed = transposeChords(activePlaySong.chords || "", playSemitones);
      playChordsScreen.innerHTML = formatChordsHtml(transposed);
    }

    document.getElementById("playTransUp").addEventListener("click", () => {
      playSemitones += 1;
      renderPlayChords();
    });

    document.getElementById("playTransDown").addEventListener("click", () => {
      playSemitones -= 1;
      renderPlayChords();
    });

    // =========================================================================
    // 8. SETLISTER (+SETLIST MODAL, 1 UNIFIED TABLE, TAP TO EXPAND)
    // =========================================================================
    const DEFAULT_CATEGORIES = [
      "Opening",
      "Joyful",
      "Solemn",
      "Pastoral",
      "Giving",
      "Closing"
    ];

    const setlistModal = document.getElementById("setlistModal");
    const setlistModalTitle = document.getElementById("setlistModalTitle");
    const setlistForm = document.getElementById("setlistForm");
    const editingSetlistId = document.getElementById("editingSetlistId");
    const setlistNameInput = document.getElementById("setlistNameInput");
    const setlistSlotsList = document.getElementById("setlistSlotsList");
    const songPickerBox = document.getElementById("songPickerBox");
    const pickerHeading = document.getElementById("pickerHeading");
    const pickerSearchInput = document.getElementById("pickerSearchInput");
    const pickerList = document.getElementById("pickerList");
    const setlistsContainer = document.getElementById("setlistsContainer");

    let draftSlots = [];
    let activePickerSlotIndex = null;
    let customSlotCounter = 1;

    function buildDefaultSlots(existingSlots = null) {
      if (Array.isArray(existingSlots) && existingSlots.length > 0) {
        return existingSlots.map((slot) => ({
          category: slot.category || "Slot",
          songId: slot.songId || "",
          songTitle: slot.songTitle || ""
        }));
      }
      return DEFAULT_CATEGORIES.map((category) => ({
        category,
        songId: "",
        songTitle: ""
      }));
    }

    function openSetlistModal(existingSetlist = null) {
      songPickerBox.classList.remove("open");
      activePickerSlotIndex = null;
      customSlotCounter = 1;

      if (existingSetlist) {
        setlistModalTitle.textContent = "Edit Setlist";
        editingSetlistId.value = existingSetlist.id;
        setlistNameInput.value = existingSetlist.name || "";
        draftSlots = buildDefaultSlots(existingSetlist.slots);
      } else {
        setlistModalTitle.textContent = "New Setlist";
        editingSetlistId.value = "";
        setlistNameInput.value = "";
        draftSlots = buildDefaultSlots();
      }

      renderDraftSlots();
      setlistModal.classList.add("open");
      setlistNameInput.focus();
    }

    function closeSetlistModal() {
      setlistModal.classList.remove("open");
      songPickerBox.classList.remove("open");
      activePickerSlotIndex = null;
    }

    function renderDraftSlots() {
      setlistSlotsList.innerHTML = draftSlots
        .map((slot, idx) => {
          const matchedSong = songs.find((s) => s.id === slot.songId);
          const displaySong = matchedSong ? matchedSong.title : (slot.songTitle || "No song selected");
          return `
            <div class="slot-row">
              <div class="slot-info">
                <div class="slot-cat">${escapeHtml(slot.category)}</div>
                <div class="slot-song">${escapeHtml(displaySong)}</div>
              </div>
              <button type="button" class="btn-plus-slot" data-pick-slot="${idx}">+</button>
            </div>
          `;
        })
        .join("");
    }

    function openSongPicker(slotIndex) {
      activePickerSlotIndex = slotIndex;
      const slot = draftSlots[slotIndex];
      pickerHeading.textContent = `Pick song for ${slot.category}`;
      pickerSearchInput.value = "";
      renderPickerList("");
      songPickerBox.classList.add("open");
      pickerSearchInput.focus();
    }

    function renderPickerList(filterText) {
      const q = filterText.trim().toLowerCase();
      const sortedMatches = sortSongsAlphabetically(songs).filter((s) =>
        (s.title || "").toLowerCase().includes(q)
      );

      if (sortedMatches.length === 0) {
        pickerList.innerHTML = `<div style="font-size:0.78rem;color:var(--text-muted);padding:4px;">No saved songs match.</div>`;
        return;
      }

      pickerList.innerHTML = sortedMatches
        .map(
          (s) => `
          <button type="button" class="picker-item" data-choose-song="${s.id}">
            ${escapeHtml(s.title)}
          </button>
        `
        )
        .join("");
    }

    document.getElementById("openSetlistModalBtn").addEventListener("click", () => openSetlistModal(null));
    document.getElementById("closeSetlistModalBtn").addEventListener("click", closeSetlistModal);

    setlistModal.addEventListener("click", (e) => {
      if (e.target === setlistModal) closeSetlistModal();
    });

    setlistSlotsList.addEventListener("click", (e) => {
      const btn = e.target.closest("[data-pick-slot]");
      if (!btn) return;
      openSongPicker(Number(btn.dataset.pickSlot));
    });

    document.getElementById("addCustomSlotBtn").addEventListener("click", () => {
      draftSlots.push({
        category: `Extra ${customSlotCounter++}`,
        songId: "",
        songTitle: ""
      });
      renderDraftSlots();
      openSongPicker(draftSlots.length - 1);
    });

    document.getElementById("cancelPickerBtn").addEventListener("click", () => {
      songPickerBox.classList.remove("open");
      activePickerSlotIndex = null;
    });

    pickerSearchInput.addEventListener("input", () => {
      renderPickerList(pickerSearchInput.value);
    });

    pickerList.addEventListener("click", (e) => {
      const chosenBtn = e.target.closest("[data-choose-song]");
      if (!chosenBtn || activePickerSlotIndex === null) return;
      const chosenId = chosenBtn.dataset.chooseSong;
      const chosenSong = songs.find((s) => s.id === chosenId);
      if (!chosenSong) return;

      draftSlots[activePickerSlotIndex].songId = chosenSong.id;
      draftSlots[activePickerSlotIndex].songTitle = chosenSong.title;
      songPickerBox.classList.remove("open");
      activePickerSlotIndex = null;
      renderDraftSlots();
    });

    setlistForm.addEventListener("submit", async (e) => {
      e.preventDefault();
      const saveBtn = document.getElementById("saveSetlistBtn");
      if (saveBtn.disabled) return;

      const name = setlistNameInput.value.trim();
      if (!name) {
        setlistNameInput.focus();
        showToast("Setlist name is required");
        return;
      }

      saveBtn.disabled = true;

      const setlistId = editingSetlistId.value || `setlist-${Date.now()}`;
      const setlistPayload = {
        id: setlistId,
        name,
        slots: draftSlots.map((slot) => ({
          category: slot.category,
          songId: slot.songId || "",
          songTitle: slot.songTitle || ""
        }))
      };

      try {
        await persistSetlistToFirebase(setlistPayload);
        expandedSetlistId = setlistId;
        closeSetlistModal();
        showToast("Setlist saved");
        if (navStack[navStack.length - 1]?.page !== "setlists") {
          navigateTo({ page: "setlists" });
        } else {
          renderSetlistsView();
        }
      } catch (err) {
        console.error("Setlist save error:", err);
        showToast("Failed to save setlist");
      } finally {
        saveBtn.disabled = false;
      }
    });

    function formatModifiedTime(ts) {
      if (!ts) return "";
      const d = new Date(ts);
      return d.toLocaleString([], {
        month: "short",
        day: "numeric",
        hour: "2-digit",
        minute: "2-digit"
      });
    }

    function renderSetlistsView() {
      const sorted = sortSetlistsByModified(setlists);
      if (sorted.length === 0) {
        setlistsContainer.innerHTML = `
          <div class="empty-state">
            <p>No saved setlists yet.</p>
            <p style="font-size:0.78rem;margin-top:4px;">Tap <strong>+Setlist</strong> to create one.</p>
          </div>
        `;
        return;
      }

      setlistsContainer.innerHTML = sorted
        .map((sl) => {
          const isExpanded = expandedSetlistId === sl.id;
          const slots = buildDefaultSlots(sl.slots);
          const rowsHtml = slots
            .map((slot) => {
              const matchedSong = songs.find((s) => s.id === slot.songId);
              const targetId = matchedSong ? matchedSong.id : "";
              const labelTitle = matchedSong ? matchedSong.title : (slot.songTitle || "Empty");
              return `
                <tr
                  class="${targetId ? "playable-row" : ""}"
                  ${targetId ? `data-play-song="${escapeHtml(targetId)}"` : ""}
                >
                  <td class="td-cat">${escapeHtml(slot.category)}</td>
                  <td class="td-song ${targetId ? "" : "empty"}">${escapeHtml(labelTitle)}</td>
                </tr>
              `;
            })
            .join("");

          return `
            <div class="setlist-card ${isExpanded ? "expanded" : ""}">
              <button type="button" class="setlist-trigger" data-toggle-setlist="${sl.id}">
                <div class="setlist-header-info">
                  <div class="setlist-name">${escapeHtml(sl.name)}</div>
                  <div class="setlist-mod">Modified: ${escapeHtml(formatModifiedTime(sl.modifiedAt || sl.updatedAt))}</div>
                </div>
                <span class="chevron">▼</span>
              </button>
              <div class="setlist-drawer">
                <div class="setlist-drawer-actions">
                  <button type="button" class="btn-action" data-edit-setlist="${sl.id}">Edit</button>
                  <button type="button" class="btn-action btn-delete" data-del-setlist="${sl.id}">Delete</button>
                </div>
                <table class="setlist-table">
                  <tbody>${rowsHtml}</tbody>
                </table>
              </div>
            </div>
          `;
        })
        .join("");
    }

    setlistsContainer.addEventListener("click", async (e) => {
      const toggleSlId = e.target.closest("[data-toggle-setlist]")?.dataset.toggleSetlist;
      if (toggleSlId) {
        expandedSetlistId = expandedSetlistId === toggleSlId ? null : toggleSlId;
        renderSetlistsView();
        return;
      }

      const playSongRow = e.target.closest("[data-play-song]");
      if (playSongRow) {
        const songId = playSongRow.dataset.playSong;
        if (songId) {
          navigateTo({ page: "play", songId });
        }
        return;
      }

      const editSlId = e.target.closest("[data-edit-setlist]")?.dataset.editSetlist;
      if (editSlId) {
        const target = setlists.find((item) => item.id === editSlId);
        if (target) openSetlistModal(target);
        return;
      }

      const delSlId = e.target.closest("[data-del-setlist]")?.dataset.delSetlist;
      if (delSlId) {
        if (confirm("Delete this setlist?")) {
          await removeSetlistFromFirebase(delSlId);
          renderSetlistsView();
          showToast("Setlist deleted");
        }
      }
    });

    // =========================================================================
    // 9. HELPERS
    // =========================================================================
    function escapeHtml(str) {
      return String(str).replace(/[&<>"']/g, (m) => ({
        "&": "&amp;",
        "<": "&lt;",
        ">": "&gt;",
        '"': "&quot;",
        "'": "&#39;"
      }[m]));
    }

    let toastTimer;
    function showToast(msg) {
      const toast = document.getElementById("toast");
      toast.textContent = msg;
      toast.classList.add("show");
      clearTimeout(toastTimer);
      toastTimer = setTimeout(() => toast.classList.remove("show"), 2000);
    }

    renderHome();
    renderSetlistsView();
  </script>
</body>
</html>
